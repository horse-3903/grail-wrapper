<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Holy Grail Mk 6 Index</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%235984EA' d='M5 2h14l-1.15 7.2a6 6 0 0 1-4.85 4.95V18h3v2H8v-2h3v-3.85A6 6 0 0 1 6.15 9.2L5 2z'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #A268CF;
    --accent: #5984EA;
    --background: #F1EFF7;
    --surface: #111827;
    --surface-2: #1B2333;
    --card: #FFFFFF;
    --card-alt: #F7F5FB;
    --text-primary: #111827;
    --text-secondary: #4B5563;
    --text-faint: #5F6779;
    --border: #E5E7EB;
    --danger: #C2504F;
    --danger-soft: #FBEAEA;
    --answers: #2F8F5B;
    --answers-soft: #E9F6EE;
    --row-hover-border: #D8D3E8;
    --scrollbar-thumb: #D9D4CB;
    --tag-school-bg: #F1EAFA;
    --role-answers-border: #CDE9D9;
    --role-questions-border: #D3DEF8;
    --role-questions-bg: #EBF0FC;
    --role-exam-color: #0E7CA8;
    --role-exam-border: #A9D6E9;
    --role-exam-bg: #E3F3FA;
    --font-body: "Hanken Grotesk", -apple-system, "Segoe UI", sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, monospace;
    --r-card: 4px;
    --r-control: 3px;
    --r-pill: 9999px;
    --sp: 8px;
  }
  :root[data-theme="dark"] {
    --background: #14121F;
    --surface: #05070C;
    --surface-2: #0F1420;
    --card: #1D1A30;
    --card-alt: #262239;
    --text-primary: #EDEAF7;
    --text-secondary: #B3AEC9;
    --text-faint: #8983A3;
    --border: #34304A;
    --danger-soft: #3A1F22;
    --answers-soft: #163625;
    --row-hover-border: #4A4468;
    --scrollbar-thumb: #3A3552;
    --tag-school-bg: #362C4D;
    --role-answers-border: #1F4E36;
    --role-questions-border: #2A3B63;
    --role-questions-bg: #202A47;
    --role-exam-color: #4FC3E0;
    --role-exam-border: #1D4B5C;
    --role-exam-bg: #17313C;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; font-family: var(--font-body); background: var(--background);
    color: var(--text-primary); font-size: 15px; line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    display: flex; flex-direction: column; height: 100vh; overflow: hidden;
  }
  a { color: inherit; }

  header {
    flex-shrink: 0;
    padding: 20px 32px; border-bottom: 1px solid var(--border); background: var(--card);
    display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap;
  }
  header h1 {
    font-size: 26px; font-weight: 600; margin: 0; letter-spacing: -0.01em;
  }
  .theme-toggle {
    margin-left: auto; background: none; border: none; padding: 0; cursor: pointer;
    display: inline-flex; align-items: center; flex-shrink: 0;
  }
  .toggle-track {
    position: relative; width: 56px; height: 28px; border-radius: var(--r-pill);
    background: #2B2A33; padding: 3px; box-sizing: border-box;
  }
  .toggle-knob {
    position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%;
    background: #fff; transition: transform .2s ease; z-index: 2;
  }
  :root[data-theme="dark"] .toggle-knob { transform: translateX(28px); }
  .toggle-moon {
    position: absolute; top: 50%; right: 9px; width: 13px; height: 13px; border-radius: 50%;
    background: #fff; transform: translateY(-50%); z-index: 1;
  }
  .toggle-moon::after {
    content: ""; position: absolute; top: -2px; left: -5px; width: 13px; height: 13px;
    border-radius: 50%; background: #2B2A33;
  }
  .toggle-sun {
    position: absolute; top: 50%; left: 9px; width: 14px; height: 14px;
    transform: translateY(-50%); z-index: 1; background: #fff;
    clip-path: polygon(50% 0%, 61% 25%, 88% 12%, 76% 38%, 100% 50%, 76% 62%, 88% 88%, 61% 75%,
      50% 100%, 39% 75%, 12% 88%, 24% 62%, 0% 50%, 24% 38%, 12% 12%, 39% 25%);
  }
  .layout { display: flex; flex-direction: column; flex: 1; min-height: 0; }

  .site-footer {
    flex-shrink: 0; padding: 10px 32px; text-align: center; font-size: 12px;
    color: var(--text-faint); background: var(--card); border-top: 1px solid var(--border);
  }
  .site-footer a { color: var(--text-secondary); text-decoration: none; }
  .site-footer a:hover { color: var(--primary); text-decoration: underline; }

  .filterbar {
    flex-shrink: 0; display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap;
    padding: 16px 28px; background: var(--card);
    border-bottom: 1px solid var(--border); position: relative;
  }
  .filterbar::before {
    content: ""; position: absolute; top: 0; left: 0; right: 0; height: 3px;
    background: linear-gradient(90deg, var(--primary), var(--accent));
  }
  /* On desktop this is a no-op wrapper - display: contents makes its children behave as
     direct flex items of .filterbar, identical to before it existed. Only becomes a real
     collapsible block at the mobile breakpoint below. */
  .filterbar-collapsible { display: contents; }
  .filter-toggle-btn {
    display: none; align-items: center; gap: 6px; padding: 9px 14px; border-radius: var(--r-control);
    border: 1px solid var(--border); background: var(--card-alt); color: var(--text-secondary);
    font-size: 13.5px; font-weight: 500; font-family: var(--font-body); cursor: pointer;
  }
  .filter-toggle-btn .filter-toggle-caret { font-size: 9px; transition: transform .15s; }
  .filter-toggle-btn[aria-expanded="true"] .filter-toggle-caret { transform: rotate(180deg); }
  .filter-group { display: flex; flex-direction: column; gap: 7px; }
  .filter-group.grow { flex: 1 1 220px; min-width: 180px; }
  .filter-group > label {
    display: block; font-family: var(--font-mono); font-size: 11px; color: var(--text-faint);
    text-transform: uppercase; letter-spacing: .04em; font-weight: 600;
  }
  .filterbar select, .filterbar input[type=text] {
    padding: 9px 10px; background: var(--card-alt); border: 1px solid var(--border);
    color: var(--text-primary); border-radius: var(--r-control); font-size: 13.5px; outline: none;
    font-family: var(--font-body); transition: border-color .12s;
  }
  .filterbar select { min-width: 140px; }
  .filterbar input[type=text] { width: 100%; }
  .filterbar select:focus, .filterbar input[type=text]:focus { border-color: var(--primary); }
  .checkbox-row { display: flex; align-items: center; gap: 8px; font-size: 13.5px; color: var(--text-secondary); cursor: pointer; white-space: nowrap; padding: 9px 2px; }
  .checkbox-row input { accent-color: var(--primary); width: 15px; height: 15px; cursor: pointer; }
  .reset-btn {
    margin-left: auto; padding: 9px 16px; border-radius: var(--r-control); border: 1px solid var(--border);
    background: var(--card-alt); color: var(--text-secondary); font-size: 13px; font-weight: 500; cursor: pointer;
    font-family: var(--font-body); white-space: nowrap;
  }
  .reset-btn:hover { border-color: var(--primary); color: var(--primary); }

  .ms { position: relative; }
  .ms-trigger {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 9px 10px; background: var(--card-alt); border: 1px solid var(--border);
    color: var(--text-primary); border-radius: var(--r-control); font-size: 13.5px; outline: none;
    font-family: var(--font-body); cursor: pointer; min-width: 150px; white-space: nowrap;
  }
  .ms-trigger:hover, .ms-trigger.active { border-color: var(--primary); }
  .ms-trigger .ms-caret { font-size: 9px; color: var(--text-faint); }
  .ms-panel {
    position: absolute; top: calc(100% + 6px); left: 0; z-index: 40; min-width: 220px;
    background: var(--card); border: 1px solid var(--border); border-radius: var(--r-control);
    box-shadow: 0 10px 28px rgba(17, 24, 39, 0.14); padding: 8px;
  }
  .ms-search {
    display: block; width: 100%; margin-bottom: 6px; padding: 7px 9px;
    background: var(--card-alt); border: 1px solid var(--border); border-radius: var(--r-control);
    color: var(--text-primary); font-size: 13px; font-family: var(--font-body); outline: none;
  }
  .ms-search:focus { border-color: var(--primary); }
  .ms-options { max-height: 260px; overflow-y: auto; }
  .ms-options .ms-option-empty {
    padding: 10px 8px; font-size: 13px; color: var(--text-faint); text-align: center;
  }
  .ms-option {
    display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: var(--r-control);
    cursor: pointer; font-size: 13.5px; font-family: var(--font-body); font-weight: 400;
    text-transform: none; letter-spacing: normal; color: var(--text-primary);
  }
  .ms-option:hover { background: var(--card-alt); }
  .ms-check {
    display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;
    width: 14px; height: 14px; color: var(--primary); font-weight: 700; font-size: 12px;
  }
  /* Selection state (persists until toggled off again) - a tick for the checkbox-style lists
     (school/doctype/paper/status), a highlighted row for the single-select ones (subject, the
     year quick-jump list) that have no separate tick mark of their own. */
  .ms-option.selected { background: var(--tag-school-bg); color: var(--primary); font-weight: 600; }
  /* Keyboard-cursor state from arrow-key navigation in the search box above - independent of
     .selected (which option is chosen) so both can apply to the same option at once. */
  .ms-option.active { background: var(--card-alt); box-shadow: inset 2px 0 0 var(--primary); }
  .ms-actions {
    display: flex; justify-content: space-between; gap: 8px; padding: 8px 4px 2px;
    border-top: 1px solid var(--border); margin-top: 6px;
  }
  .ms-actions button {
    font-size: 12px; font-family: var(--font-mono); background: none; border: none;
    color: var(--text-secondary); cursor: pointer; padding: 4px 6px;
  }
  .ms-actions button:hover { color: var(--primary); }

  .year-panel { min-width: 220px; }
  /* ~1.5 rows tall on purpose - a partially-cut-off row hints there's more to scroll to,
     without a long list of years dominating the panel above the slider/range inputs */
  .year-options { max-height: 47px; margin-bottom: 8px; }
  /* Extra breathing room below the slider before the manual from/to boxes, so the two ways
     of setting a range (drag vs. type) read as visually distinct sections. */
  .year-range-inputs { display: flex; align-items: center; gap: 8px; margin-top: 20px; }
  .year-range-inputs input[type=text] {
    width: 0; flex: 1 1 0; padding: 8px 10px; border: 1px solid var(--border); border-radius: var(--r-control);
    font-size: 13.5px; font-family: var(--font-body); background: var(--card-alt); color: var(--text-primary);
    outline: none; text-align: center;
  }
  .year-range-inputs input[type=text]:focus { border-color: var(--primary); }
  .year-range-sep { color: var(--text-faint); flex-shrink: 0; }

  .year-slider-wrap { padding: 22px 6px 6px; }
  .year-slider-track {
    position: relative; height: 4px; background: var(--border); border-radius: 2px; margin: 0 8px;
  }
  .year-slider-range { position: absolute; height: 4px; background: var(--primary); border-radius: 2px; }
  .year-slider-thumb {
    position: absolute; top: 50%; width: 16px; height: 16px; border-radius: 50%;
    background: var(--primary); border: 2px solid var(--card); box-shadow: 0 1px 3px rgba(0,0,0,.3);
    transform: translate(-50%, -50%); cursor: grab; touch-action: none;
  }
  .year-slider-thumb:active { cursor: grabbing; }
  .year-slider-thumb:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  /* Live value for this specific handle, floating above the circle so it's readable
     regardless of where the two thumbs currently sit relative to each other - plain text,
     not a tooltip-styled bubble. */
  .year-slider-bubble {
    position: absolute; bottom: calc(100% + 5px); left: 50%; transform: translateX(-50%);
    color: var(--text-secondary); font-family: var(--font-mono); font-size: 11px;
    font-weight: 600; white-space: nowrap; pointer-events: none;
  }
  /* Positioned directly on the track (not inside a thumb) at the midpoint between the two
     thumbs, matching the individual bubbles' height - shown instead of them when the thumbs
     are close enough together that two separate labels would overlap (see renderYearSlider). */
  .year-slider-bubble-combined { bottom: calc(50% + 13px); }
  /* The slider's fixed overall span (earliest/latest year in the dataset) - constant,
     unlike the bubbles above which track the current selection. */
  .year-slider-domain {
    display: flex; justify-content: space-between; margin: 10px 8px 0;
    font-family: var(--font-mono); font-size: 11px; color: var(--text-faint);
  }

  .results {
    flex: 1; min-height: 0; display: flex; flex-direction: column;
    padding: 16px 28px 0;
  }
  .col-headers {
    flex-shrink: 0;
    display: grid; grid-template-columns: 2.05fr 0.7fr 0.55fr 0.75fr 0.4fr 0.9fr 0.75fr;
    gap: 12px; padding: 10px 16px; font-family: var(--font-mono); font-size: 10.5px; color: var(--text-faint);
    text-transform: uppercase; letter-spacing: .04em; font-weight: 600; text-align: center;
    background: var(--background); border-bottom: 1px solid var(--border);
    /* --col-headers-right-pad (16px + the real scrollbar width) is set in JS once
       results-scroll has laid out (see syncScrollbarGutter()) and stays constant thanks to
       scrollbar-gutter: stable below, so header columns line up with the row columns
       underneath instead of the row grid being narrower by however wide this browser's real
       scrollbar happens to be. 26px fallback matches the 10px custom-styled scrollbar below. */
    padding-right: var(--col-headers-right-pad, 26px);
  }
  .col-headers > div:first-child { text-align: left; }
  .col-headers > div.sortable { cursor: pointer; user-select: none; }
  .col-headers > div.sortable:hover { color: var(--text-secondary); }
  .col-headers > div.sortable.sort-active { color: var(--accent); }
  .col-headers > div.sortable .sort-arrow { margin-left: 3px; opacity: .8; }
  .results-scroll {
    flex: 1; min-height: 0; overflow-y: auto; padding: 0 28px 48px 0;
    /* .results has 28px of right padding for visual inset, which would otherwise push the
       scrollbar in with it - cancel it with a matching negative margin (and reapply the same
       28px as this element's own right padding) so the scrollbar rides the true right edge of
       the page while the row content keeps its original inset. */
    margin-right: -28px;
    /* always reserve space for the scrollbar even when the list is short enough not to need
       scrolling, so the row grid's width - and therefore its measured gutter and column
       alignment with .col-headers above - doesn't shift depending on row count */
    scrollbar-gutter: stable;
  }

  .row {
    display: grid; grid-template-columns: 2.05fr 0.7fr 0.55fr 0.75fr 0.4fr 0.9fr 0.75fr;
    gap: 12px; align-items: center; padding: 13px 16px; border-radius: var(--r-card);
    margin: 6px 0; background: var(--card); border: 1px solid var(--border);
    box-shadow: 0 1px 2px rgba(17, 24, 39, 0.03);
  }
  .row.group-row { cursor: pointer; }
  .row.group-row:hover { border-color: var(--primary); }
  .row:not(.group-row):hover { border-color: var(--row-hover-border); }

  .row > div:not(.title-cell), .member-row > div:not(.title-cell) { text-align: center; }

  .title-cell { display: flex; align-items: center; gap: 9px; min-width: 0; }
  .col-badges { display: flex; align-items: center; justify-content: center; gap: 6px; flex-wrap: wrap; min-width: 0; }
  .row-meta { display: contents; }
  .doc-link {
    text-decoration: none; color: var(--text-primary); font-size: 16px; font-weight: 500;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .doc-link:hover { color: var(--accent); text-decoration: underline; }
  .group-title {
    color: var(--text-primary); font-size: 16px; font-weight: 600;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .tag {
    display: inline-block; padding: 2px 8px; border-radius: var(--r-control); font-family: var(--font-mono);
    font-size: 11px; background: var(--card-alt); color: var(--text-secondary); border: 1px solid var(--border);
    font-weight: 600;
  }
  .tag.school { background: var(--tag-school-bg); color: var(--primary); border-color: transparent; }
  .cell-muted { color: var(--text-secondary); font-size: 13px; }

  .flag-badge {
    position: relative; display: inline-flex; align-items: center; gap: 4px; font-size: 11px;
    font-family: var(--font-mono); color: var(--danger); background: var(--danger-soft);
    padding: 2px 8px; border-radius: var(--r-control); font-weight: 600; cursor: help;
  }
  .flag-badge::after {
    content: attr(data-tooltip);
    position: absolute; top: calc(100% + 6px); left: 0; z-index: 30;
    background: var(--surface); color: #F2F4F8; font-family: var(--font-body); font-weight: 400;
    font-size: 12.5px; line-height: 1.4; padding: 8px 10px; border-radius: var(--r-control);
    width: max-content; max-width: 280px; white-space: pre-line;
    box-shadow: 0 6px 18px rgba(17, 24, 39, 0.25);
    opacity: 0; visibility: hidden; transition: opacity .12s;
    pointer-events: none;
  }
  .flag-badge:hover::after { opacity: 1; visibility: visible; }

  /* recolor with the theme via mask-image instead of embedding a fixed-color icon */
  .source-badge {
    display: inline-block; width: 13px; height: 13px; flex-shrink: 0;
    background-color: var(--text-faint);
    -webkit-mask-size: contain; mask-size: contain;
    -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;
    -webkit-mask-position: center; mask-position: center;
    cursor: help;
  }
  .source-badge.drive { -webkit-mask-image: url('drive-icon.png'); mask-image: url('drive-icon.png'); }
  .source-badge.link { width: 14px; height: 14px; -webkit-mask-image: url('link-icon.png'); mask-image: url('link-icon.png'); }

  .actions { display: flex; gap: 6px; justify-content: center; }
  .actions a, .actions button {
    font-size: 11px; font-family: var(--font-mono); padding: 5px 10px; border-radius: var(--r-control);
    border: 1px solid var(--border); background: var(--card-alt); color: var(--text-secondary);
    text-decoration: none; font-weight: 600; cursor: pointer;
  }
  .actions a:hover, .actions button:hover { border-color: var(--accent); color: var(--accent); }

  .members { padding: 0 0 4px 0; margin-top: -2px; }
  .member-row {
    display: grid; grid-template-columns: 2.05fr 0.7fr 0.55fr 0.75fr 0.4fr 0.9fr 0.75fr;
    gap: 12px; align-items: center; padding: 10px 16px; border-radius: var(--r-card);
    margin: 3px 0; background: var(--card-alt); border: 1px dashed var(--border);
  }
  .row-indent { flex-shrink: 0; width: 24px; }
  .member-title-wrap { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
  .member-orig {
    font-size: 13px; color: var(--text-faint);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .role-badge {
    font-family: var(--font-mono); font-size: 10.5px; font-weight: 600; padding: 2px 8px;
    border-radius: var(--r-control); background: var(--card); color: var(--text-secondary);
    border: 1px solid var(--border); width: fit-content; white-space: nowrap;
  }
  .role-badge.answers { color: var(--answers); border-color: var(--role-answers-border); background: var(--answers-soft); }
  .role-badge.questions { color: var(--accent); border-color: var(--role-questions-border); background: var(--role-questions-bg); }
  .role-badge.exam-paper { color: var(--role-exam-color); border-color: var(--role-exam-border); background: var(--role-exam-bg); }

  .empty { color: var(--text-faint); padding: 64px 20px; text-align: center; font-size: 14.5px; }

  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }

  .modal-overlay {
    position: fixed; inset: 0; background: rgba(5, 7, 12, 0.5); z-index: 100;
    display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .modal-overlay[hidden] { display: none; }
  .modal {
    background: var(--card); border-radius: var(--r-card); padding: 24px; width: 420px; max-width: 100%;
    box-shadow: 0 20px 60px rgba(5, 7, 12, 0.35); max-height: 85vh; overflow-y: auto;
  }
  .modal h2 {
    margin: 0 0 4px; font-size: 17px; font-weight: 600; color: var(--text-primary);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .modal-subtitle {
    margin: 0 0 18px; font-size: 12.5px; color: var(--text-faint);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .modal-field { margin-bottom: 12px; }
  .modal-field label {
    display: block; font-family: var(--font-mono); font-size: 11px; color: var(--text-faint);
    text-transform: uppercase; letter-spacing: .04em; font-weight: 600; margin-bottom: 6px;
  }
  .modal-field input {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: var(--r-control);
    font-size: 13.5px; font-family: var(--font-body); background: var(--card-alt); color: var(--text-primary);
    outline: none;
  }
  .modal-field input:focus { border-color: var(--primary); }
  .modal-hint { font-size: 12px; color: var(--text-faint); margin: -6px 0 12px; }

  .group-current {
    font-size: 13px; color: var(--text-secondary); margin-bottom: 8px; line-height: 1.4;
    padding: 8px 10px; background: var(--card-alt); border: 1px solid var(--border); border-radius: var(--r-control);
  }
  .group-current strong { color: var(--text-primary); }
  .group-results { margin-top: 6px; max-height: 160px; overflow-y: auto; }
  .group-results:not(:empty) {
    border: 1px solid var(--border); border-radius: var(--r-control); background: var(--card-alt);
  }
  .group-result {
    padding: 8px 10px; cursor: pointer; font-size: 13px; color: var(--text-primary);
    border-bottom: 1px solid var(--border);
  }
  .group-result:last-child { border-bottom: none; }
  .group-result:hover { background: var(--card); }
  .group-result.gr-empty { cursor: default; color: var(--text-faint); }
  .group-result.gr-empty:hover { background: none; }
  .group-result .gr-meta { font-size: 11px; color: var(--text-faint); margin-top: 2px; }
  .group-ungroup-btn {
    margin-top: 10px; font-size: 12px; font-family: var(--font-mono); background: none; border: none;
    color: var(--text-secondary); cursor: pointer; padding: 0; text-decoration: underline;
  }
  .group-ungroup-btn:hover { color: var(--danger); }

  .modal-actions { display: flex; align-items: center; justify-content: flex-end; gap: 10px; margin-top: 16px; }
  .modal-status { margin-right: auto; font-size: 12px; color: var(--text-faint); }
  .modal-actions button {
    padding: 8px 16px; border-radius: var(--r-control); font-size: 13px; font-weight: 500; cursor: pointer;
    font-family: var(--font-body); border: 1px solid var(--border); background: var(--card-alt); color: var(--text-secondary);
  }
  #edit-cancel:hover { border-color: var(--primary); color: var(--primary); }
  #edit-save { background: #7B3FA0; border-color: #7B3FA0; color: #fff; }
  #edit-save:hover { opacity: .9; }

  /* Laptop-width windows (a maximized 1280-1366px-wide laptop screen, or any browser window
     resized to less than full desktop width) - still plenty of room for the full grid table,
     but not enough for all 8 filter controls on one line, so .filterbar wraps. reset-btn's
     margin-left: auto (meant to pin it to the far right of one full-width row) then isolates
     it with an ugly gap on whatever line it wraps to instead. Above this tier the bar is
     assumed to fit on one line, where auto-margin correctly reads as "pinned to that row's
     end"; below it, let it flow like every other control instead. */
  @media (max-width: 1300px) {
    /* justify-content applies per wrapped line, not just to the container as a whole, so
       this centers each individual row of filter controls rather than leaving them packed
       against the left edge with empty space trailing on the right. */
    .filterbar { justify-content: center; }
    .reset-btn { margin-left: 0; }
  }

  /* Covers phones and portrait tablets (iPad portrait is ~768px) as one tier: below this,
     a multi-column data grid stops being usable at arm's length and touch-target sizing
     matters more than density, so the table becomes a stack of cards and the filter bar
     collapses behind a toggle instead of eating the first screenful on its own. */
  @media (max-width: 820px) {
    header { padding: 14px 16px; gap: 10px; }
    header h1 { font-size: 19px; }

    .site-footer { padding: 10px 16px; }

    .filterbar { padding: 12px 16px; gap: 10px; }
    .filter-group.grow { flex: 1 1 100%; }
    /* Plain text, no button chrome - the tappable area is the full row under the search bar
       rather than a small pill, so it reads as "the next section of the filter bar" instead
       of a separate control floating on its own. */
    .filter-toggle-btn {
      display: flex; width: 100%; justify-content: center; padding: 10px 14px;
      border: none; border-radius: 0; background: none;
    }
    /* Collapsed is the plain default here - no .open class, no JS needed to establish it -
       so there's no window for a mistimed script to leave it visibly expanded on load. JS
       only ever adds/removes .open; the CSS alone decides what "no .open" looks like. Laid
       out 2-up rather than one full-width control per row so opening it doesn't push the
       results list almost entirely off-screen, per feedback that a single narrow phone
       screenshot was mostly filter panel with one sliver of a result underneath it. */
    .filterbar-collapsible {
      display: none; grid-template-columns: 1fr 1fr; gap: 10px 12px; width: 100%;
    }
    .filterbar-collapsible.open { display: grid; }
    .filterbar-collapsible .filter-group { width: auto; min-width: 0; }
    .filterbar-collapsible .checkbox-row { grid-column: 1 / -1; }
    .filterbar select, .filterbar .ms-trigger { width: 100%; min-width: 0; }
    .reset-btn { grid-column: 1 / -1; margin-left: 0; width: 100%; text-align: center; }

    .results { padding: 12px 14px 0; }
    .results-scroll { padding: 0 14px 40px 0; margin-right: -14px; }
    .col-headers { display: none; }

    .row, .member-row {
      grid-template-columns: 1fr; gap: 8px; padding: 14px;
    }
    .row > div:not(.title-cell), .member-row > div:not(.title-cell) { text-align: left; }
    .col-badges { justify-content: flex-start; }
    .row-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
    .actions { justify-content: flex-start; }
    .actions a, .actions button { padding: 7px 14px; }

    .row-indent { display: none; }
    .member-row { border-left: 3px solid var(--primary); border-left-style: dashed; }
  }
</style>
</head>

<script>
let DATA = [];
let GROUPS = [];       // one entry per group_id: {isGroup, key, members:[...]}
const openGroups = new Set();

const $ = (id) => document.getElementById(id);
const esc = (s) => (s ?? "").toString().replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uniq = (arr) => [...new Set(arr.filter(Boolean))].sort();

const THEME_KEY = "grail-theme";
function applyTheme(theme) {
  document.documentElement.setAttribute("data-theme", theme);
  const btn = $("theme-toggle");
  btn.setAttribute("aria-pressed", theme === "dark" ? "true" : "false");
  btn.setAttribute("aria-label", theme === "dark" ? "Switch to light mode" : "Switch to dark mode");
}
function initTheme() {
  let stored = null;
  try { stored = localStorage.getItem(THEME_KEY); } catch { /* private mode etc */ }
  const theme = stored || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  applyTheme(theme);
}
$("theme-toggle").addEventListener("click", () => {
  const next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
  try { localStorage.setItem(THEME_KEY, next); } catch { /* private mode etc */ }
  applyTheme(next);
});
initTheme();

// Collapses the many raw paper_info_role variants (QP, Solution, TYS Answers, Essay Solutions Q3,
// Insert, Guide, ...) into exactly two badges: Answers or Questions. Anything that isn't clearly
// an answer/solution/mark scheme (including inserts, which accompany the question paper) counts
// as Questions.
function classifyRole(role) {
  const r = (role || "").trim().toLowerCase();
  if (r.includes("qp")) return "Questions"; // bundled docs like "QP + Guide" still contain the paper itself
  if (r.includes("answer") || r.includes("solution") || r.includes("mark scheme") || r.includes("guide")) return "Answers";
  return "Questions";
}

function isQuestionsRole(role) {
  return classifyRole(role) === "Questions";
}

function buildGroups(data) {
  const byId = new Map();
  for (const e of data) {
    if (!byId.has(e.group_id)) byId.set(e.group_id, []);
    byId.get(e.group_id).push(e);
  }
  const groups = [];
  for (const [gid, members] of byId) {
    if (members.length === 1) {
      groups.push({ isGroup: false, key: gid, primary: members[0], members });
    } else {
      const primary = members.find(m => isQuestionsRole(m.paper_info_role)) || members[0];
      members.sort((a, b) => (a.paper_number || 0) - (b.paper_number || 0)
        || (isQuestionsRole(a.paper_info_role) === isQuestionsRole(b.paper_info_role) ? 0 : isQuestionsRole(a.paper_info_role) ? -1 : 1));
      groups.push({ isGroup: true, key: gid, primary, members });
    }
  }
  return groups;
}

function updateSubjectTrigger() {
  const trigger = $("f-subject-trigger");
  trigger.firstChild.textContent = selectedSubject || "All subjects";
  trigger.classList.toggle("active", !!selectedSubject);
}

// Single-select, unlike the checkbox lists below - clicking an option replaces the whole
// selection and closes the panel immediately, same interaction as a native <select>.
function populateSubjectOptions(values) {
  SUBJECT_VALUES = values;
  const optionsEl = $("f-subject-options");
  optionsEl.innerHTML = "";
  for (const v of values) {
    const opt = document.createElement("div");
    opt.className = "ms-option" + (v === selectedSubject ? " selected" : "");
    opt.textContent = v;
    opt.addEventListener("click", () => {
      selectedSubject = v;
      updateSubjectTrigger();
      $("f-subject-panel").hidden = true;
      populateSubjectOptions(values);
      applyFilters();
    });
    optionsEl.appendChild(opt);
  }
  updateSubjectTrigger();
}

// Quick-jump list layered on top of the original from/to range inputs (kept as-is) - multi-
// select like the checkbox lists (ticking several years computes a span rather than jumping
// to just one): yearMin/yearMax become the min/max of everything currently ticked. Manually
// typing a range into the from/to boxes below doesn't touch selectedYears, so the two entry
// paths stay simple - both just set yearMin/yearMax, they don't try to reconcile with the
// other's notion of "what's selected".
function populateYearOptions(values) {
  YEAR_VALUES = values;
  if (values.length) {
    yearDomainMax = Number(values[0]);
    yearDomainMin = Number(values[values.length - 1]);
  }
  const optionsEl = $("f-year-options");
  optionsEl.innerHTML = "";
  for (const v of values) {
    const opt = document.createElement("div");
    const isChecked = selectedYears.has(v);
    opt.className = "ms-option" + (isChecked ? " selected" : "");
    const check = document.createElement("span");
    check.className = "ms-check";
    check.textContent = isChecked ? "✓" : "";
    const label = document.createElement("span");
    label.textContent = v;
    opt.appendChild(check);
    opt.appendChild(label);
    opt.addEventListener("click", () => {
      const nowChecked = !selectedYears.has(v);
      if (nowChecked) selectedYears.add(v); else selectedYears.delete(v);
      if (selectedYears.size) {
        const nums = [...selectedYears].map(Number);
        yearMin = Math.min(...nums);
        yearMax = Math.max(...nums);
      } else {
        yearMin = null; yearMax = null;
      }
      $("f-year-from").value = yearMin ?? "";
      $("f-year-to").value = yearMax ?? "";
      updateYearTrigger();
      populateYearOptions(values);
      applyFilters();
    });
    optionsEl.appendChild(opt);
  }
  syncYearThumbsFromRange();
  renderYearSlider();
}

// Draggable dual-thumb range slider mirroring yearMin/yearMax - a visual, coarse-grained
// alternative to typing exact numbers into the from/to boxes below, which stay the precise
// entry method for an exact year. yearDomainMin/Max (the earliest/latest year anywhere in the
// dataset) are recomputed each populateYearOptions() call above since that always runs off
// the same full YEAR_VALUES list.
let yearDomainMin = 0, yearDomainMax = 1;

// Each thumb tracks its own raw value independently, deliberately NOT clamped against the
// other thumb - clamping "min can't pass max" is what made both thumbs unmovable once a
// single year selection left them coincident (whichever direction would cross the other was
// permanently blocked, on a thumb sitting exactly on top of its sibling). Letting them cross
// freely and just taking min()/max() of the two on commit removes that dead end entirely.
let thumbMinValue = 0, thumbMaxValue = 1;

function yearValueToPercent(v) {
  if (yearDomainMax === yearDomainMin) return 0;
  return ((v - yearDomainMin) / (yearDomainMax - yearDomainMin)) * 100;
}

function yearPercentToValue(percent) {
  return Math.round(yearDomainMin + (percent / 100) * (yearDomainMax - yearDomainMin));
}

// Below this gap (in percent of track width), two separate value labels would overlap -
// merge them into one "min–max" label centered between the thumbs instead of showing both.
const YEAR_BUBBLE_COLLISION_PCT = 16;

function renderYearSlider() {
  const pMin = yearValueToPercent(thumbMinValue);
  const pMax = yearValueToPercent(thumbMaxValue);
  $("year-slider-thumb-min").style.left = `${pMin}%`;
  $("year-slider-thumb-max").style.left = `${pMax}%`;
  const lo = Math.min(pMin, pMax);
  const hi = Math.max(pMin, pMax);
  $("year-slider-range").style.left = `${lo}%`;
  $("year-slider-range").style.width = `${hi - lo}%`;
  $("year-slider-domain-min").textContent = yearDomainMin;
  $("year-slider-domain-max").textContent = yearDomainMax;

  const minBubble = $("year-slider-thumb-min-bubble");
  const maxBubble = $("year-slider-thumb-max-bubble");
  const combinedBubble = $("year-slider-combined-bubble");
  if (hi - lo < YEAR_BUBBLE_COLLISION_PCT) {
    minBubble.hidden = true;
    maxBubble.hidden = true;
    combinedBubble.hidden = false;
    combinedBubble.style.left = `${(pMin + pMax) / 2}%`;
    combinedBubble.textContent = thumbMinValue === thumbMaxValue
      ? `${thumbMinValue}` : `${Math.min(thumbMinValue, thumbMaxValue)}–${Math.max(thumbMinValue, thumbMaxValue)}`;
  } else {
    minBubble.hidden = false;
    maxBubble.hidden = false;
    combinedBubble.hidden = true;
    minBubble.textContent = thumbMinValue;
    maxBubble.textContent = thumbMaxValue;
  }
}

// Snaps the slider's internal per-thumb state back to yearMin/yearMax - called whenever the
// range changes from outside a drag (quick-list clicks, manual apply/clear/reset, URL
// restore) via populateYearOptions(), and also right after a drag commits, so the two thumbs
// "un-cross" back into their canonical min-on-left/max-on-right order once you let go.
function syncYearThumbsFromRange() {
  thumbMinValue = yearMin ?? yearDomainMin;
  thumbMaxValue = yearMax ?? yearDomainMax;
}

function commitYearRange() {
  yearMin = Math.min(thumbMinValue, thumbMaxValue);
  yearMax = Math.max(thumbMinValue, thumbMaxValue);
  $("f-year-from").value = yearMin;
  $("f-year-to").value = yearMax;
  updateYearTrigger();
  populateYearOptions(YEAR_VALUES);
  applyFilters();
}

function setupYearSliderDrag(thumbId, isMinThumb) {
  const thumb = $(thumbId);
  const track = $("year-slider-track");

  function moveTo(clientX) {
    const rect = track.getBoundingClientRect();
    const percent = Math.max(0, Math.min(100, ((clientX - rect.left) / rect.width) * 100));
    const value = yearPercentToValue(percent);
    if (isMinThumb) thumbMinValue = value; else thumbMaxValue = value;
    renderYearSlider();
  }

  thumb.addEventListener("pointerdown", (ev) => {
    ev.preventDefault();
    thumb.setPointerCapture(ev.pointerId);
    moveTo(ev.clientX);
    const onMove = (mv) => moveTo(mv.clientX);
    const onUp = () => {
      thumb.removeEventListener("pointermove", onMove);
      thumb.removeEventListener("pointerup", onUp);
      commitYearRange();
    };
    thumb.addEventListener("pointermove", onMove);
    thumb.addEventListener("pointerup", onUp);
  });

  // Arrow-key nudging for keyboard users, matching the slider's role="slider" semantics
  thumb.addEventListener("keydown", (ev) => {
    if (ev.key !== "ArrowLeft" && ev.key !== "ArrowRight") return;
    ev.preventDefault();
    const delta = ev.key === "ArrowRight" ? 1 : -1;
    const current = isMinThumb ? thumbMinValue : thumbMaxValue;
    const next = Math.max(yearDomainMin, Math.min(yearDomainMax, current + delta));
    if (isMinThumb) thumbMinValue = next; else thumbMaxValue = next;
    renderYearSlider();
    commitYearRange();
  });
}

// School/document-type/paper accept multiple selected values (checkbox dropdowns); year
// is a range with separate start/end inputs (either side may be left open-ended).
const multiFilters = { school: new Set(), doctype: new Set(), paper: new Set(), status: new Set() };
let yearMin = null, yearMax = null;
let selectedYears = new Set();
// Subject is single-select (unlike the checkbox multi-selects above), so it's just a scalar -
// SUBJECT_VALUES is kept around so the clear button and reset can re-render the option list.
let selectedSubject = "";
let SUBJECT_VALUES = [];
let YEAR_VALUES = [];

const MULTI_LABELS = { school: "All schools", doctype: "All types", paper: "All papers", status: "All statuses" };

function updateMultiTrigger(key) {
  const trigger = $(`f-${key}-trigger`);
  const n = multiFilters[key].size;
  const label = n === 0 ? MULTI_LABELS[key] : (n === 1 ? [...multiFilters[key]][0] : `${n} selected`);
  trigger.firstChild.textContent = label;
  trigger.classList.toggle("active", n > 0);
}

function populateMultiSelect(key, values) {
  const optionsEl = $(`f-${key}-options`);
  optionsEl.innerHTML = "";
  for (const v of values) {
    const opt = document.createElement("div");
    const isChecked = multiFilters[key].has(v);
    opt.className = "ms-option" + (isChecked ? " selected" : "");
    const check = document.createElement("span");
    check.className = "ms-check";
    check.textContent = isChecked ? "✓" : "";
    const label = document.createElement("span");
    label.textContent = v;
    opt.appendChild(check);
    opt.appendChild(label);
    opt.addEventListener("click", () => {
      const nowChecked = !multiFilters[key].has(v);
      if (nowChecked) multiFilters[key].add(v); else multiFilters[key].delete(v);
      opt.classList.toggle("selected", nowChecked);
      check.textContent = nowChecked ? "✓" : "";
      updateMultiTrigger(key);
      applyFilters();
    });
    optionsEl.appendChild(opt);
  }
  updateMultiTrigger(key);
}

// Shared by every .ms-panel that has a .ms-search box (school/doctype/paper/status's
// checkbox lists, plus subject's and year's single-click option lists below) - filters the
// already-rendered .ms-option elements by substring match rather than re-fetching/rebuilding
// them, so it works the same regardless of what kind of option markup a given panel uses.
function filterMsOptions(key) {
  const searchEl = document.getElementById(`f-${key}-search`);
  if (!searchEl) return;
  const query = searchEl.value.trim().toLowerCase();
  const optionsEl = $(`f-${key}-options`);
  const labels = optionsEl.querySelectorAll(".ms-option");
  let anyVisible = false;
  labels.forEach(label => {
    const match = label.textContent.toLowerCase().includes(query);
    label.style.display = match ? "" : "none";
    if (match) anyVisible = true;
  });
  let empty = optionsEl.querySelector(".ms-option-empty");
  if (!anyVisible && labels.length) {
    if (!empty) {
      empty = document.createElement("div");
      empty.className = "ms-option-empty";
      empty.textContent = "No matches";
      optionsEl.appendChild(empty);
    }
  } else if (empty) {
    empty.remove();
  }
  setActiveMsOption(key, 0);
}

// Tracks which currently-visible option the search box's arrow keys have moved a highlight
// to, per panel - independent of .selected (what's actually chosen), so typing/arrowing
// doesn't change the filter until Enter (or a click) commits it.
const msActiveIndex = {};

function getVisibleMsOptions(key) {
  return [...$(`f-${key}-options`).querySelectorAll(".ms-option")].filter(o => o.style.display !== "none");
}

function setActiveMsOption(key, index) {
  const visible = getVisibleMsOptions(key);
  visible.forEach(o => o.classList.remove("active"));
  if (!visible.length) {
    msActiveIndex[key] = -1;
    return;
  }
  const clamped = Math.max(0, Math.min(index, visible.length - 1));
  visible[clamped].classList.add("active");
  visible[clamped].scrollIntoView({ block: "nearest" });
  msActiveIndex[key] = clamped;
}

function closeAllPanels(except) {
  document.querySelectorAll(".ms-panel").forEach(p => {
    if (p !== except) p.hidden = true;
  });
}

function setupDropdown(key) {
  const trigger = $(`f-${key}-trigger`);
  const panel = $(`f-${key}-panel`);
  const search = document.getElementById(`f-${key}-search`);
  trigger.addEventListener("click", (ev) => {
    ev.stopPropagation();
    const willOpen = panel.hidden;
    closeAllPanels(willOpen ? panel : null);
    panel.hidden = !willOpen;
    if (willOpen && search) {
      search.value = "";
      filterMsOptions(key);
      search.focus();
    }
  });
  panel.addEventListener("click", (ev) => ev.stopPropagation());
  if (search) {
    search.addEventListener("input", () => filterMsOptions(key));
    search.addEventListener("keydown", (ev) => {
      if (ev.key === "ArrowDown") {
        ev.preventDefault();
        setActiveMsOption(key, (msActiveIndex[key] ?? -1) + 1);
      } else if (ev.key === "ArrowUp") {
        ev.preventDefault();
        setActiveMsOption(key, (msActiveIndex[key] ?? 0) - 1);
      } else if (ev.key === "Enter") {
        ev.preventDefault();
        const visible = getVisibleMsOptions(key);
        const idx = msActiveIndex[key];
        if (idx != null && idx >= 0 && visible[idx]) visible[idx].click();
      }
    });
  }
}

document.addEventListener("click", () => closeAllPanels(null));

["subject", "school", "doctype", "paper", "status"].forEach(setupDropdown);
document.querySelectorAll("[data-clear]").forEach(btn => {
  btn.addEventListener("click", () => {
    const key = btn.dataset.clear;
    if (key === "subject") {
      selectedSubject = "";
      updateSubjectTrigger();
      populateSubjectOptions(SUBJECT_VALUES);
      applyFilters();
      return;
    }
    multiFilters[key].clear();
    $(`f-${key}-options`).querySelectorAll(".ms-option").forEach(o => {
      o.classList.remove("selected");
      o.querySelector(".ms-check").textContent = "";
    });
    updateMultiTrigger(key);
    applyFilters();
  });
});

function parseYearInput(value) {
  return /^\d{4}$/.test(value.trim()) ? Number(value.trim()) : null;
}

function updateYearTrigger() {
  const trigger = $("f-year-trigger");
  let label = "All years";
  if (yearMin != null && yearMax != null) label = yearMin === yearMax ? `${yearMin}` : `${yearMin}–${yearMax}`;
  else if (yearMin != null) label = `${yearMin}+`;
  else if (yearMax != null) label = `Up to ${yearMax}`;
  trigger.firstChild.textContent = label;
  trigger.classList.toggle("active", yearMin != null || yearMax != null);
}

function applyYearInput() {
  yearMin = parseYearInput($("f-year-from").value);
  yearMax = parseYearInput($("f-year-to").value);
  if (yearMin != null && yearMax != null && yearMin > yearMax) [yearMin, yearMax] = [yearMax, yearMin];
  updateYearTrigger();
  populateYearOptions(YEAR_VALUES);
  applyFilters();
}

setupDropdown("year");
setupYearSliderDrag("year-slider-thumb-min", true);
setupYearSliderDrag("year-slider-thumb-max", false);
$("f-year-apply").addEventListener("click", applyYearInput);
["f-year-from", "f-year-to"].forEach(id => {
  $(id).addEventListener("keydown", (ev) => {
    if (ev.key === "Enter") { applyYearInput(); $("f-year-panel").hidden = true; }
  });
});
$("f-year-clear").addEventListener("click", () => {
  $("f-year-from").value = "";
  $("f-year-to").value = "";
  yearMin = null; yearMax = null;
  selectedYears.clear();
  updateYearTrigger();
  populateYearOptions(YEAR_VALUES);
  applyFilters();
});

// Reads every filter control once per applyFilters() call instead of once per document -
// with 3300+ documents, re-querying the DOM inside the per-entry predicate made every
// keystroke redo thousands of getElementById/.value calls.
function getFilterState() {
  const search = $("f-search").value.trim().toLowerCase();
  return {
    searchWords: search ? search.split(/\s+/).filter(Boolean) : [],
    subject: selectedSubject,
    schools: multiFilters.school,
    yearMin, yearMax,
    doctypes: multiFilters.doctype,
    papers: multiFilters.paper,
    statuses: multiFilters.status,
    flaggedOnly: $("f-flagged").checked,
  };
}

function matchesFilters(e, f) {
  if (f.searchWords.length) {
    const hay = (e.display_name + " " + e.original_name).toLowerCase();
    if (!f.searchWords.every(w => hay.includes(w))) return false;
  }
  if (f.subject && e.subject !== f.subject) return false;
  if (f.schools.size && !f.schools.has(e.school)) return false;
  if (f.yearMin != null || f.yearMax != null) {
    const y = Number(e.year_resolved);
    if (!y) return false;
    if (f.yearMin != null && y < f.yearMin) return false;
    if (f.yearMax != null && y > f.yearMax) return false;
  }
  if (f.doctypes.size && !f.doctypes.has(e.doc_type)) return false;
  if (f.papers.size && !f.papers.has(String(e.paper_number))) return false;
  if (f.flaggedOnly && !e.flagged) return false;
  return true;
}

// Column-header sorting: click once for ascending, again for descending, a third time
// resets to the default (year desc, then name) - dir cycles 1 -> -1 -> 0.
// Matches what the Status column actually shows: a group row always renders "Exam Paper"
// (see renderRows) regardless of its primary member's own role, so filtering/sorting by the
// primary's classifyRole() instead of this scattered visually-identical "Exam Paper" rows.
function rowStatus(g) {
  return g.isGroup ? "Exam Paper" : classifyRole(g.primary.paper_info_role || g.primary.doc_type);
}

const SORT_KEYS = {
  document: g => g.primary.display_name || "",
  status: rowStatus,
  school: g => g.primary.school || "",
  subject: g => g.primary.subject || "",
  year: g => g.primary.year_resolved ? Number(g.primary.year_resolved) : null,
  type: g => g.primary.doc_type || "",
};
let sortState = { key: null, dir: 0 };

function sortGroups(list) {
  if (sortState.key && sortState.dir) {
    const keyFn = SORT_KEYS[sortState.key];
    list.sort((a, b) => {
      const av = keyFn(a), bv = keyFn(b);
      const aBlank = av === "" || av == null, bBlank = bv === "" || bv == null;
      if (aBlank || bBlank) {
        if (aBlank && bBlank) return 0;
        return aBlank ? 1 : -1; // blanks always last, regardless of sort direction
      }
      const cmp = (typeof av === "number" && typeof bv === "number") ? av - bv : String(av).localeCompare(String(bv));
      return sortState.dir * cmp;
    });
  } else {
    list.sort((a, b) => (Number(b.primary.year_resolved) || 0) - (Number(a.primary.year_resolved) || 0)
      || a.primary.display_name.localeCompare(b.primary.display_name));
  }
  return list;
}

document.querySelectorAll(".col-headers .sortable").forEach(header => {
  const key = header.dataset.sort;
  header.addEventListener("click", () => {
    if (sortState.key !== key) {
      sortState = { key, dir: 1 };
    } else if (sortState.dir === 1) {
      sortState.dir = -1;
    } else {
      sortState = { key: null, dir: 0 };
    }
    document.querySelectorAll(".col-headers .sortable").forEach(h => {
      h.classList.toggle("sort-active", h === header && sortState.dir !== 0);
      h.querySelector(".sort-arrow").textContent =
        (h === header && sortState.dir === 1) ? "↑" : (h === header && sortState.dir === -1) ? "↓" : "";
    });
    applyFilters();
  });
});

// Short codes for the closed-set filter values (subject/doctype/status), keeping shared
// links compact - "MYEs/CAs/Other Tests" or "H2 Mathematics" spelled out in full, repeated
// across several selected values, was the main thing bloating the URL. Falls back to the raw
// value on encode/decode if it's ever missing from the map (e.g. a new doc_type/subject added
// to the data before this list is updated), so nothing breaks - the URL is just less compact.
const SUBJECT_CODES = {
  "H1 Chemistry": "h1ch", "H1 Economics": "h1ec", "H1 General Paper": "gp",
  "H2 Chemistry": "h2ch", "H2 Computing": "h2co", "H2 Economics": "h2ec",
  "H2 Mathematics": "h2ma", "H2 Physics": "h2ph",
};
const DOCTYPE_CODES = {
  "Exam Papers": "ep", "MYEs/CAs/Other Tests": "mye", "Notes/Practices": "np",
  "TYS Answers": "tys", "User Mock Papers": "ump",
};
const STATUS_CODES = { "Exam Paper": "e", "Questions": "q", "Answers": "a" };

const invert = (map) => Object.fromEntries(Object.entries(map).map(([k, v]) => [v, k]));
const SUBJECT_CODES_REV = invert(SUBJECT_CODES);
const DOCTYPE_CODES_REV = invert(DOCTYPE_CODES);
const STATUS_CODES_REV = invert(STATUS_CODES);

const encodeValue = (map, value) => map[value] || value;
const decodeValue = (revMap, code) => revMap[code] || code;

// Mirrors the current filter state into the URL's query string (replaceState, not
// pushState - filter changes shouldn't spam browser history) so a filtered view can be
// bookmarked or shared as a link, and restored on load by readFiltersFromUrl() below.
function updateUrlFromFilters() {
  const params = new URLSearchParams();
  const search = $("f-search").value.trim();
  if (search) params.set("q", search);
  if (selectedSubject) params.set("s", encodeValue(SUBJECT_CODES, selectedSubject));
  if (multiFilters.school.size) params.set("sc", [...multiFilters.school].join(","));
  if (multiFilters.doctype.size)
    params.set("dt", [...multiFilters.doctype].map(v => encodeValue(DOCTYPE_CODES, v)).join(","));
  if (multiFilters.paper.size) params.set("pp", [...multiFilters.paper].join(","));
  if (multiFilters.status.size)
    params.set("st", [...multiFilters.status].map(v => encodeValue(STATUS_CODES, v)).join(","));
  if (yearMin != null) params.set("y0", yearMin);
  if (yearMax != null) params.set("y1", yearMax);
  const flaggedEl = document.getElementById("f-flagged");
  if (flaggedEl && flaggedEl.checked) params.set("fl", "1");

  const qs = params.toString();
  const newUrl = qs ? `${location.pathname}?${qs}` : location.pathname;
  history.replaceState(null, "", newUrl);
}

function applyFilters() {
  const f = getFilterState();
  const visible = [];
  for (const g of GROUPS) {
    if (g.isGroup) {
      const matched = g.members.filter(m => matchesFilters(m, f));
      if (matched.length) {
        const primary = matched.find(m => isQuestionsRole(m.paper_info_role)) || matched[0];
        visible.push({ ...g, primary, members: matched });
      }
    } else {
      if (matchesFilters(g.primary, f)) visible.push(g);
    }
  }
  // Status is a row-level concept (what the Status column shows), not a per-member one -
  // applied after grouping so a multi-member "Exam Paper" row is judged as a whole.
  const withStatus = f.statuses.size ? visible.filter(g => f.statuses.has(rowStatus(g))) : visible;
  sortGroups(withStatus);
  renderRows(withStatus);
  updateUrlFromFilters();
}

function roleClass(role) {
  return classifyRole(role) === "Answers" ? "answers" : "questions";
}

function roleLabel(m) {
  return classifyRole(m.paper_info_role || m.doc_type);
}

// inline_url (document.grail.moe) is a stable direct link and opens in-tab; download_url
// (api.grail.moe) forces a download via an S3 Content-Disposition:attachment header
function pdfUrl(e) {
  return e.inline_url || e.download_url;
}

function flagBadgeHtml(e) {
  if (!e.flagged) return "";
  return `<span class="flag-badge" data-tooltip="${esc(e.flag_reason || "Flagged for review")}">! review</span>`;
}

function sourceBadgeHtml(e) {
  return e.source === "drive"
    ? `<span class="source-badge drive" title="From Google Drive"></span>`
    : `<span class="source-badge link" title="Direct link (grail.moe)"></span>`;
}

// Group headers are collapsed by default, so a flagged member inside would otherwise be invisible
function groupFlagBadgeHtml(members) {
  const flagged = members.filter(m => m.flagged);
  if (!flagged.length) return "";
  const tooltip = flagged.length === 1
    ? (flagged[0].flag_reason || "Flagged for review")
    : `${flagged.length} files flagged:\n` + flagged.map(m => `- ${m.flag_reason || "Flagged for review"}`).join("\n");
  return `<span class="flag-badge" data-tooltip="${esc(tooltip)}">! ${flagged.length} flagged</span>`;
}

// Group headers are collapsed by default, so show Drive if any member came from Drive,
// otherwise the group is entirely direct grail.moe links.
function groupSourceBadgeHtml(members) {
  return members.some(m => m.source === "drive")
    ? `<span class="source-badge drive" title="Includes files from Google Drive"></span>`
    : `<span class="source-badge link" title="Direct link (grail.moe)"></span>`;
}

// A group's own title must never single out one paper number: for a known school, its
// group_id already merges every paper of the sitting (P1-P4, questions and answers alike)
// under one topic - the primary member just happens to carry its own paper number in
// display_name (e.g. "ACJC 2025 H2 Math Prelim P1"), which misrepresents the whole group.
const PAPER_NUM_RE = /(?<![A-Za-z0-9])P(?:aper)?\.?\s*[1-4](?![0-9])/gi;
function groupTitle(primary) {
  return (primary.display_name || "").replace(PAPER_NUM_RE, "").replace(/\s+/g, " ").trim();
}

// The wrapping .row-meta is display:contents on desktop (a no-op - its children behave as
// direct grid items of .row/.member-row, one per column, identical to before it existed) and
// becomes a real flex-wrap row of compact tags at the mobile breakpoint, where the grid
// collapses to a single stacked column and these four would otherwise be four separate lines.
function rowMetaHtml(e) {
  return `
    <div class="row-meta">
      <div>${e.school ? `<span class="tag school">${esc(e.school)}</span>` : `<span class="cell-muted">-</span>`}</div>
      <div class="cell-muted">${esc(e.subject || "")}</div>
      <div class="cell-muted">${esc(e.year_resolved || "-")}</div>
      <div class="cell-muted">${esc(e.doc_type || "")}</div>
    </div>`;
}

function renderRows(groups) {
  const container = $("rows");
  $("empty").style.display = groups.length ? "none" : "block";

  const frag = document.createDocumentFragment();
  for (const g of groups.slice(0, 600)) {
    if (g.isGroup) {
      const isOpen = openGroups.has(g.key);
      const row = document.createElement("div");
      row.className = "row group-row";
      row.innerHTML = `
        <div class="title-cell">
          ${groupSourceBadgeHtml(g.members)}
          <div class="member-title-wrap">
            <span class="group-title">${esc(groupTitle(g.primary))}</span>
            <span class="member-orig">${esc(g.primary.original_name)}</span>
          </div>
        </div>
        <div class="col-badges">
          <span class="role-badge exam-paper">Exam Paper</span>
          ${groupFlagBadgeHtml(g.members)}
        </div>
        ${rowMetaHtml(g.primary)}
        <div class="actions">
          <a href="${g.primary.note_url}" target="_blank" onclick="event.stopPropagation()">Source</a>
        </div>`;
      row.addEventListener("click", () => {
        if (openGroups.has(g.key)) openGroups.delete(g.key); else openGroups.add(g.key);
        applyFilters();
      });
      frag.appendChild(row);

      if (isOpen) {
        const membersWrap = document.createElement("div");
        membersWrap.className = "members";
        for (const m of g.members) {
          const mrow = document.createElement("div");
          mrow.className = "member-row";
          mrow.innerHTML = `
            <div class="title-cell">
              <span class="row-indent"></span>
              ${sourceBadgeHtml(m)}
              <div class="member-title-wrap">
                <a class="doc-link" href="${pdfUrl(m)}" target="_blank">${esc(m.display_name)}</a>
                <span class="member-orig">${esc(m.original_name)}</span>
              </div>
            </div>
            <div class="col-badges">
              <span class="role-badge ${roleClass(m.paper_info_role)}">${esc(roleLabel(m))}</span>
              ${flagBadgeHtml(m)}
            </div>
            ${rowMetaHtml(m)}
            <div class="actions"><a href="${m.note_url}" target="_blank">Source</a><button type="button" class="edit-btn" data-id="${esc(m.id)}">Edit</button></div>`;
          membersWrap.appendChild(mrow);
        }
        frag.appendChild(membersWrap);
      }
    } else {
      const e = g.primary;
      const row = document.createElement("div");
      row.className = "row";
      row.innerHTML = `
        <div class="title-cell">
          ${sourceBadgeHtml(e)}
          <div class="member-title-wrap">
            <a class="doc-link" href="${pdfUrl(e)}" target="_blank">${esc(e.display_name)}</a>
            <span class="member-orig">${esc(e.original_name)}</span>
          </div>
        </div>
        <div class="col-badges">
          <span class="role-badge ${roleClass(e.paper_info_role)}">${esc(roleLabel(e))}</span>
          ${flagBadgeHtml(e)}
        </div>
        ${rowMetaHtml(e)}
        <div class="actions"><a href="${e.note_url}" target="_blank">Source</a><button type="button" class="edit-btn" data-id="${esc(e.id)}">Edit</button></div>`;
      frag.appendChild(row);
    }
  }
  container.replaceChildren(frag);
}

let searchDebounce;
$("f-search").addEventListener("input", () => {
  clearTimeout(searchDebounce);
  searchDebounce = setTimeout(applyFilters, 100);
});
$("f-flagged").addEventListener("input", applyFilters);

// Mobile-only "Filters" toggle. Collapsed-by-default is a plain CSS default below the 820px
// breakpoint (.filterbar-collapsible has no .open class in the initial HTML) - not something
// this script has to establish itself, so there's no window where a script that hasn't run
// yet (or a matchMedia check racing page paint) leaves the panel visibly expanded. This
// listener only ever adds/removes .open in response to an actual click.
const filterToggleBtn = $("filter-toggle");
const filterCollapsible = $("filterbar-collapsible");
filterToggleBtn.addEventListener("click", () => {
  const open = filterCollapsible.classList.toggle("open");
  filterToggleBtn.setAttribute("aria-expanded", String(open));
});
$("f-reset").addEventListener("click", () => {
  $("f-search").value = "";
  selectedSubject = "";
  updateSubjectTrigger();
  populateSubjectOptions(SUBJECT_VALUES);
  for (const key of ["school", "doctype", "paper", "status"]) {
    multiFilters[key].clear();
    $(`f-${key}-options`).querySelectorAll(".ms-option").forEach(o => {
      o.classList.remove("selected");
      o.querySelector(".ms-check").textContent = "";
    });
    updateMultiTrigger(key);
  }
  $("f-year-from").value = "";
  $("f-year-to").value = "";
  yearMin = null; yearMax = null;
  selectedYears.clear();
  updateYearTrigger();
  populateYearOptions(YEAR_VALUES);
  $("f-flagged").checked = false;
  applyFilters();
});

// Per-row metadata/grouping editor (local server only - every write backs up
// data/tagged.json to data/backups/ first, see server.py).
let editingId = null;
let groupIndex = [];  // built fresh each time the modal opens: [{group_id, label, count, searchText}]

function buildGroupIndex() {
  return GROUPS.map(g => ({
    group_id: g.key,
    label: g.primary.display_name,
    count: g.members.length,
    searchText: [
      g.primary.display_name, g.primary.school, g.primary.subject, g.primary.year_resolved,
      ...g.members.map(m => m.original_name),
    ].filter(Boolean).join(" ").toLowerCase(),
  }));
}

function renderGroupCurrent(e) {
  const grp = GROUPS.find(g => g.key === e.group_id);
  const count = grp ? grp.members.length : 1;
  $("group-current-label").innerHTML = count > 1
    ? `Grouped with <strong>${count - 1}</strong> other document${count - 1 === 1 ? "" : "s"} as <strong>${esc(e.display_name)}</strong>`
    : `Not currently grouped with any other document.`;
  $("group-ungroup").hidden = count <= 1;
}

function renderGroupResults(query, currentGroupId) {
  const resultsEl = $("group-results");
  resultsEl.innerHTML = "";
  const words = query.toLowerCase().trim().split(/\s+/).filter(Boolean);
  if (!words.length) return;

  const matches = groupIndex
    .filter(g => g.group_id !== currentGroupId && words.every(w => g.searchText.includes(w)))
    .slice(0, 8);

  if (!matches.length) {
    resultsEl.innerHTML = `<div class="group-result gr-empty">No matching groups</div>`;
    return;
  }
  for (const g of matches) {
    const div = document.createElement("div");
    div.className = "group-result";
    div.innerHTML = `${esc(g.label)}<div class="gr-meta">${g.count} file${g.count === 1 ? "" : "s"}</div>`;
    div.addEventListener("click", () => mergeIntoGroup(g.group_id, g.label));
    resultsEl.appendChild(div);
  }
}

async function mergeIntoGroup(targetGroupId, targetLabel) {
  $("edit-status").textContent = "Merging...";
  try {
    const res = await fetch(`/api/note/${encodeURIComponent(editingId)}/merge`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ target_group_id: targetGroupId }),
    });
    const body = await res.json();
    if (!res.ok) throw new Error(body.error || "Merge failed");
    DATA = body.entries;
    GROUPS = buildGroups(DATA);
    groupIndex = buildGroupIndex();
    applyFilters();
    const entry = DATA.find(d => d.id === editingId);
    renderGroupCurrent(entry);
    $("group-search").value = "";
    $("group-results").innerHTML = "";
    $("edit-status").textContent = `Merged into "${targetLabel}"`;
  } catch (err) {
    $("edit-status").textContent = err.message;
  }
}

async function ungroupEntry() {
  $("edit-status").textContent = "Splitting...";
  try {
    const res = await fetch(`/api/note/${encodeURIComponent(editingId)}/ungroup`, { method: "POST" });
    const body = await res.json();
    if (!res.ok) throw new Error(body.error || "Split failed");
    DATA = body.entries;
    GROUPS = buildGroups(DATA);
    groupIndex = buildGroupIndex();
    applyFilters();
    const entry = DATA.find(d => d.id === editingId);
    renderGroupCurrent(entry);
    $("edit-status").textContent = "Split into its own group";
  } catch (err) {
    $("edit-status").textContent = err.message;
  }
}

let groupSearchDebounce;
$("group-search").addEventListener("input", () => {
  clearTimeout(groupSearchDebounce);
  groupSearchDebounce = setTimeout(() => {
    const entry = DATA.find(d => d.id === editingId);
    renderGroupResults($("group-search").value, entry ? entry.group_id : null);
  }, 120);
});
$("group-ungroup").addEventListener("click", ungroupEntry);

function openEditModal(e) {
  editingId = e.id;
  $("edit-modal-title").textContent = e.display_name;
  $("edit-modal-subtitle").textContent = e.original_name;
  $("edit-school").value = e.school || "";
  $("edit-paper-info").value = e.paper_info || "";
  $("edit-subject").value = e.subject || "";
  $("edit-doctype").value = e.doc_type || "";
  $("edit-year").value = e.year_resolved || "";
  $("edit-paper-number").value = e.paper_number ?? "";
  $("edit-status").textContent = "";
  groupIndex = buildGroupIndex();
  renderGroupCurrent(e);
  $("group-search").value = "";
  $("group-results").innerHTML = "";
  $("edit-modal").hidden = false;
}

function closeEditModal() {
  $("edit-modal").hidden = true;
  editingId = null;
}

$("edit-cancel").addEventListener("click", closeEditModal);
$("edit-modal").addEventListener("click", (ev) => {
  if (ev.target.id === "edit-modal") closeEditModal();
});

$("rows").addEventListener("click", (ev) => {
  const btn = ev.target.closest(".edit-btn");
  if (!btn) return;
  ev.stopPropagation();
  const entry = DATA.find(d => d.id === btn.dataset.id);
  if (entry) openEditModal(entry);
});

$("edit-save").addEventListener("click", async () => {
  if (!editingId) return;
  const payload = {
    school: $("edit-school").value.trim() || null,
    paper_info: $("edit-paper-info").value.trim() || null,
    subject: $("edit-subject").value.trim() || null,
    doc_type: $("edit-doctype").value.trim() || null,
    year_resolved: $("edit-year").value.trim() || null,
    paper_number: $("edit-paper-number").value.trim() || null,
  };
  $("edit-status").textContent = "Saving...";
  try {
    const res = await fetch(`/api/note/${encodeURIComponent(editingId)}`, {
      method: "PATCH",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });
    const body = await res.json();
    if (!res.ok) throw new Error(body.error || "Save failed");
    const idx = DATA.findIndex(d => d.id === body.id);
    if (idx !== -1) DATA[idx] = body;
    GROUPS = buildGroups(DATA);
    applyFilters();
    closeEditModal();
  } catch (err) {
    $("edit-status").textContent = err.message;
  }
});

// Runs before the option lists are built, since populateMultiSelect()/populateSubjectOptions()/
// populateYearOptions() decide checked/highlighted state from this data at render time - the
// URL has to land here before that happens, not after.
function readMultiFiltersFromUrl(params) {
  if (params.has("s")) selectedSubject = decodeValue(SUBJECT_CODES_REV, params.get("s"));
  if (params.has("y0")) yearMin = Number(params.get("y0"));
  if (params.has("y1")) yearMax = Number(params.get("y1"));
  const raw_sc = params.get("sc");
  if (raw_sc) for (const v of raw_sc.split(",").filter(Boolean)) multiFilters.school.add(v);
  const raw_dt = params.get("dt");
  if (raw_dt) for (const v of raw_dt.split(",").filter(Boolean)) multiFilters.doctype.add(decodeValue(DOCTYPE_CODES_REV, v));
  const raw_pp = params.get("pp");
  if (raw_pp) for (const v of raw_pp.split(",").filter(Boolean)) multiFilters.paper.add(v);
  const raw_st = params.get("st");
  if (raw_st) for (const v of raw_st.split(",").filter(Boolean)) multiFilters.status.add(decodeValue(STATUS_CODES_REV, v));
}

// Runs after the controls exist (the year range text inputs) - reflects the y0/y1 already
// applied to yearMin/yearMax in readMultiFiltersFromUrl() into the visible from/to boxes.
function applyRemainingFiltersFromUrl(params) {
  if (params.has("q")) $("f-search").value = params.get("q");
  if (params.has("y0")) $("f-year-from").value = params.get("y0");
  if (params.has("y1")) $("f-year-to").value = params.get("y1");
  updateYearTrigger();
  const flaggedEl = document.getElementById("f-flagged");
  if (flaggedEl && params.get("fl") === "1") flaggedEl.checked = true;
}

// Preserves the results list's scroll position across a page reload (sessionStorage, not
// localStorage - this is "come back to where I was", not something that should survive into
// a totally unrelated future visit). Saved continuously while scrolling, restored once after
// the first render; filter/sort changes re-render the list and naturally reset scroll to the
// top on their own, which is correct - only a reload should jump back to where you were.
const SCROLL_KEY = "grail-results-scroll-y";
const resultsScrollEl = $("results-scroll");
let scrollSaveTimer;
resultsScrollEl.addEventListener("scroll", () => {
  clearTimeout(scrollSaveTimer);
  scrollSaveTimer = setTimeout(() => {
    try { sessionStorage.setItem(SCROLL_KEY, String(resultsScrollEl.scrollTop)); } catch { /* private mode etc */ }
  }, 100);
});

function restoreScrollPosition() {
  let saved;
  try { saved = sessionStorage.getItem(SCROLL_KEY); } catch { return; }
  if (saved != null) resultsScrollEl.scrollTop = Number(saved) || 0;
}

// Measures the real, currently-rendered scrollbar width (varies by browser/OS - no point
// guessing a pixel value) and exposes it as --scrollbar-w for .col-headers's padding-right to
// match. scrollbar-gutter: stable on .results-scroll keeps this constant regardless of
// whether the filtered list is actually tall enough to scroll, so one measurement after the
// first render is enough - it never needs recomputing later.
function syncScrollbarGutter() {
  const width = resultsScrollEl.offsetWidth - resultsScrollEl.clientWidth;
  document.documentElement.style.setProperty("--col-headers-right-pad", `${16 + width}px`);
}

async function loadData() {
  const data = await fetch("/api/notes").then(r => r.json());
  DATA = data;
  GROUPS = buildGroups(data);

  const urlParams = new URLSearchParams(location.search);
  readMultiFiltersFromUrl(urlParams);

  populateSubjectOptions(uniq(data.map(d => d.subject)));
  populateMultiSelect("school", uniq(data.map(d => d.school)));
  populateMultiSelect("doctype", uniq(data.map(d => d.doc_type)));
  populateMultiSelect("paper", uniq(data.map(d => d.paper_number)).sort((a,b) => a - b).map(n => String(n)));
  populateMultiSelect("status", ["Exam Paper", "Questions", "Answers"]);
  populateYearOptions(uniq(data.map(d => d.year_resolved)).sort((a, b) => b - a));

  applyRemainingFiltersFromUrl(urlParams);
  applyFilters();
  syncScrollbarGutter();
  restoreScrollPosition();
}

loadData();
</script>
