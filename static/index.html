<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Holy Grail Mk 6 Index</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #A268CF;
    --accent: #5984EA;
    --background: #F1EFF7;
    --surface: #111827;
    --surface-2: #1B2333;
    --card: #FFFFFF;
    --card-alt: #F7F5FB;
    --text-primary: #111827;
    --text-secondary: #4B5563;
    --text-faint: #5F6779;
    --border: #E5E7EB;
    --danger: #C2504F;
    --danger-soft: #FBEAEA;
    --answers: #2F8F5B;
    --answers-soft: #E9F6EE;
    --row-hover-border: #D8D3E8;
    --scrollbar-thumb: #D9D4CB;
    --tag-school-bg: #F1EAFA;
    --role-answers-border: #CDE9D9;
    --role-questions-border: #D3DEF8;
    --role-questions-bg: #EBF0FC;
    --role-exam-color: #0E7CA8;
    --role-exam-border: #A9D6E9;
    --role-exam-bg: #E3F3FA;
    --font-body: "Hanken Grotesk", -apple-system, "Segoe UI", sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, monospace;
    --r-card: 4px;
    --r-control: 3px;
    --r-pill: 9999px;
    --sp: 8px;
  }
  :root[data-theme="dark"] {
    --background: #14121F;
    --surface: #05070C;
    --surface-2: #0F1420;
    --card: #1D1A30;
    --card-alt: #262239;
    --text-primary: #EDEAF7;
    --text-secondary: #B3AEC9;
    --text-faint: #8983A3;
    --border: #34304A;
    --danger-soft: #3A1F22;
    --answers-soft: #163625;
    --row-hover-border: #4A4468;
    --scrollbar-thumb: #3A3552;
    --tag-school-bg: #362C4D;
    --role-answers-border: #1F4E36;
    --role-questions-border: #2A3B63;
    --role-questions-bg: #202A47;
    --role-exam-color: #4FC3E0;
    --role-exam-border: #1D4B5C;
    --role-exam-bg: #17313C;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; font-family: var(--font-body); background: var(--background);
    color: var(--text-primary); font-size: 15px; line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    display: flex; flex-direction: column; height: 100vh; overflow: hidden;
    transition: background-color .15s, color .15s;
  }
  a { color: inherit; }

  header {
    flex-shrink: 0;
    padding: 20px 32px; border-bottom: 1px solid var(--border); background: var(--card);
    display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap;
  }
  header h1 {
    font-size: 26px; font-weight: 600; margin: 0; letter-spacing: -0.01em;
  }
  .theme-toggle {
    margin-left: auto; background: none; border: none; padding: 0; cursor: pointer;
    display: inline-flex; align-items: center; flex-shrink: 0;
  }
  .toggle-track {
    position: relative; width: 56px; height: 28px; border-radius: var(--r-pill);
    background: #2B2A33; padding: 3px; box-sizing: border-box;
  }
  .toggle-knob {
    position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%;
    background: #fff; transition: transform .2s ease; z-index: 2;
  }
  :root[data-theme="dark"] .toggle-knob { transform: translateX(28px); }
  .toggle-moon {
    position: absolute; top: 50%; right: 9px; width: 13px; height: 13px; border-radius: 50%;
    background: #fff; transform: translateY(-50%); z-index: 1;
  }
  .toggle-moon::after {
    content: ""; position: absolute; top: -2px; left: -5px; width: 13px; height: 13px;
    border-radius: 50%; background: #2B2A33;
  }
  .toggle-sun {
    position: absolute; top: 50%; left: 9px; width: 14px; height: 14px;
    transform: translateY(-50%); z-index: 1; background: #fff;
    clip-path: polygon(50% 0%, 61% 25%, 88% 12%, 76% 38%, 100% 50%, 76% 62%, 88% 88%, 61% 75%,
      50% 100%, 39% 75%, 12% 88%, 24% 62%, 0% 50%, 24% 38%, 12% 12%, 39% 25%);
  }
  .layout { display: flex; flex-direction: column; flex: 1; min-height: 0; }

  .filterbar {
    flex-shrink: 0; display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap;
    padding: 16px 28px; background: var(--card);
    border-bottom: 1px solid var(--border); position: relative;
  }
  .filterbar::before {
    content: ""; position: absolute; top: 0; left: 0; right: 0; height: 3px;
    background: linear-gradient(90deg, var(--primary), var(--accent));
  }
  .filter-group { display: flex; flex-direction: column; gap: 7px; }
  .filter-group.grow { flex: 1 1 220px; min-width: 180px; }
  .filter-group > label {
    display: block; font-family: var(--font-mono); font-size: 11px; color: var(--text-faint);
    text-transform: uppercase; letter-spacing: .04em; font-weight: 600;
  }
  .filterbar select, .filterbar input[type=text] {
    padding: 9px 10px; background: var(--card-alt); border: 1px solid var(--border);
    color: var(--text-primary); border-radius: var(--r-control); font-size: 13.5px; outline: none;
    font-family: var(--font-body); transition: border-color .12s;
  }
  .filterbar select { min-width: 140px; }
  .filterbar input[type=text] { width: 100%; }
  .filterbar select:focus, .filterbar input[type=text]:focus { border-color: var(--primary); }
  .checkbox-row { display: flex; align-items: center; gap: 8px; font-size: 13.5px; color: var(--text-secondary); cursor: pointer; white-space: nowrap; padding: 9px 2px; }
  .checkbox-row input { accent-color: var(--primary); width: 15px; height: 15px; cursor: pointer; }
  .reset-btn {
    margin-left: auto; padding: 9px 16px; border-radius: var(--r-control); border: 1px solid var(--border);
    background: var(--card-alt); color: var(--text-secondary); font-size: 13px; font-weight: 500; cursor: pointer;
    font-family: var(--font-body); white-space: nowrap;
  }
  .reset-btn:hover { border-color: var(--primary); color: var(--primary); }

  .ms { position: relative; }
  .ms-trigger {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 9px 10px; background: var(--card-alt); border: 1px solid var(--border);
    color: var(--text-primary); border-radius: var(--r-control); font-size: 13.5px; outline: none;
    font-family: var(--font-body); cursor: pointer; min-width: 150px; white-space: nowrap;
  }
  .ms-trigger:hover, .ms-trigger.active { border-color: var(--primary); }
  .ms-trigger .ms-caret { font-size: 9px; color: var(--text-faint); }
  .ms-panel {
    position: absolute; top: calc(100% + 6px); left: 0; z-index: 40; min-width: 220px;
    background: var(--card); border: 1px solid var(--border); border-radius: var(--r-control);
    box-shadow: 0 10px 28px rgba(17, 24, 39, 0.14); padding: 8px;
  }
  .ms-options { max-height: 260px; overflow-y: auto; }
  .ms-option {
    display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: var(--r-control);
    cursor: pointer; font-size: 13.5px; font-family: var(--font-body); font-weight: 400;
    text-transform: none; letter-spacing: normal; color: var(--text-primary);
  }
  .ms-option:hover { background: var(--card-alt); }
  .ms-option input { accent-color: var(--primary); cursor: pointer; }
  .ms-actions {
    display: flex; justify-content: space-between; gap: 8px; padding: 8px 4px 2px;
    border-top: 1px solid var(--border); margin-top: 6px;
  }
  .ms-actions button {
    font-size: 12px; font-family: var(--font-mono); background: none; border: none;
    color: var(--text-secondary); cursor: pointer; padding: 4px 6px;
  }
  .ms-actions button:hover { color: var(--primary); }

  .year-panel { min-width: 220px; }
  .year-range-inputs { display: flex; align-items: center; gap: 8px; }
  .year-range-inputs input[type=text] {
    width: 0; flex: 1 1 0; padding: 8px 10px; border: 1px solid var(--border); border-radius: var(--r-control);
    font-size: 13.5px; font-family: var(--font-body); background: var(--card-alt); color: var(--text-primary);
    outline: none; text-align: center;
  }
  .year-range-inputs input[type=text]:focus { border-color: var(--primary); }
  .year-range-sep { color: var(--text-faint); flex-shrink: 0; }

  .results {
    flex: 1; min-height: 0; display: flex; flex-direction: column;
    padding: 16px 28px 0;
  }
  .col-headers {
    flex-shrink: 0;
    display: grid; grid-template-columns: 2.05fr 0.7fr 0.55fr 0.75fr 0.4fr 0.9fr 0.75fr;
    gap: 12px; padding: 10px 16px; font-family: var(--font-mono); font-size: 10.5px; color: var(--text-faint);
    text-transform: uppercase; letter-spacing: .04em; font-weight: 600; text-align: center;
    background: var(--background); border-bottom: 1px solid var(--border);
  }
  .col-headers > div:first-child { text-align: left; }
  .results-scroll {
    flex: 1; min-height: 0; overflow-y: auto; padding: 0 0 48px 0;
    scrollbar-width: none; -ms-overflow-style: none;
  }
  .results-scroll::-webkit-scrollbar { display: none; }

  .row {
    display: grid; grid-template-columns: 2.05fr 0.7fr 0.55fr 0.75fr 0.4fr 0.9fr 0.75fr;
    gap: 12px; align-items: center; padding: 13px 16px; border-radius: var(--r-card);
    margin: 6px 0; background: var(--card); border: 1px solid var(--border);
    box-shadow: 0 1px 2px rgba(17, 24, 39, 0.03);
  }
  .row.group-row { cursor: pointer; }
  .row.group-row:hover { border-color: var(--primary); }
  .row:not(.group-row):hover { border-color: var(--row-hover-border); }

  .row > div:not(.title-cell), .member-row > div:not(.title-cell) { text-align: center; }

  .title-cell { display: flex; align-items: center; gap: 9px; min-width: 0; }
  .col-badges { display: flex; align-items: center; justify-content: center; gap: 6px; flex-wrap: wrap; min-width: 0; }
  .doc-link {
    text-decoration: none; color: var(--text-primary); font-size: 16px; font-weight: 500;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .doc-link:hover { color: var(--accent); text-decoration: underline; }
  .group-title {
    color: var(--text-primary); font-size: 16px; font-weight: 600;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .tag {
    display: inline-block; padding: 2px 8px; border-radius: var(--r-control); font-family: var(--font-mono);
    font-size: 11px; background: var(--card-alt); color: var(--text-secondary); border: 1px solid var(--border);
    font-weight: 600;
  }
  .tag.school { background: var(--tag-school-bg); color: var(--primary); border-color: transparent; }
  .cell-muted { color: var(--text-secondary); font-size: 13px; }

  .flag-badge {
    position: relative; display: inline-flex; align-items: center; gap: 4px; font-size: 11px;
    font-family: var(--font-mono); color: var(--danger); background: var(--danger-soft);
    padding: 2px 8px; border-radius: var(--r-control); font-weight: 600; cursor: help;
  }
  .flag-badge::after {
    content: attr(data-tooltip);
    position: absolute; bottom: calc(100% + 6px); left: 0; z-index: 30;
    background: var(--surface); color: #F2F4F8; font-family: var(--font-body); font-weight: 400;
    font-size: 12.5px; line-height: 1.4; padding: 8px 10px; border-radius: var(--r-control);
    width: max-content; max-width: 280px; white-space: pre-line;
    box-shadow: 0 6px 18px rgba(17, 24, 39, 0.25);
    opacity: 0; visibility: hidden; transition: opacity .12s;
    pointer-events: none;
  }
  .flag-badge:hover::after { opacity: 1; visibility: visible; }

  /* recolors with the theme via mask-image instead of embedding a fixed-color icon */
  .drive-badge {
    display: inline-block; width: 13px; height: 13px; flex-shrink: 0;
    background-color: var(--text-faint);
    -webkit-mask-image: url('drive-icon.png'); mask-image: url('drive-icon.png');
    -webkit-mask-size: contain; mask-size: contain;
    -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;
    -webkit-mask-position: center; mask-position: center;
    cursor: help;
  }

  .actions { display: flex; gap: 6px; justify-content: center; }
  .actions a, .actions button {
    font-size: 11px; font-family: var(--font-mono); padding: 5px 10px; border-radius: var(--r-control);
    border: 1px solid var(--border); background: var(--card-alt); color: var(--text-secondary);
    text-decoration: none; font-weight: 600; cursor: pointer;
  }
  .actions a:hover, .actions button:hover { border-color: var(--accent); color: var(--accent); }

  .members { padding: 0 0 4px 0; margin-top: -2px; }
  .member-row {
    display: grid; grid-template-columns: 2.05fr 0.7fr 0.55fr 0.75fr 0.4fr 0.9fr 0.75fr;
    gap: 12px; align-items: center; padding: 10px 16px; border-radius: var(--r-card);
    margin: 3px 0; background: var(--card-alt); border: 1px dashed var(--border);
  }
  .row-indent { flex-shrink: 0; width: 24px; }
  .member-title-wrap { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
  .member-orig {
    font-size: 13px; color: var(--text-faint);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .role-badge {
    font-family: var(--font-mono); font-size: 10.5px; font-weight: 600; padding: 2px 8px;
    border-radius: var(--r-control); background: var(--card); color: var(--text-secondary);
    border: 1px solid var(--border); width: fit-content; white-space: nowrap;
  }
  .role-badge.answers { color: var(--answers); border-color: var(--role-answers-border); background: var(--answers-soft); }
  .role-badge.questions { color: var(--accent); border-color: var(--role-questions-border); background: var(--role-questions-bg); }
  .role-badge.exam-paper { color: var(--role-exam-color); border-color: var(--role-exam-border); background: var(--role-exam-bg); }

  .empty { color: var(--text-faint); padding: 64px 20px; text-align: center; font-size: 14.5px; }

  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }

  .modal-overlay {
    position: fixed; inset: 0; background: rgba(5, 7, 12, 0.5); z-index: 100;
    display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .modal-overlay[hidden] { display: none; }
  .modal {
    background: var(--card); border-radius: var(--r-card); padding: 24px; width: 420px; max-width: 100%;
    box-shadow: 0 20px 60px rgba(5, 7, 12, 0.35); max-height: 85vh; overflow-y: auto;
  }
  .modal h2 {
    margin: 0 0 4px; font-size: 17px; font-weight: 600; color: var(--text-primary);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .modal-subtitle {
    margin: 0 0 18px; font-size: 12.5px; color: var(--text-faint);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .modal-field { margin-bottom: 12px; }
  .modal-field label {
    display: block; font-family: var(--font-mono); font-size: 11px; color: var(--text-faint);
    text-transform: uppercase; letter-spacing: .04em; font-weight: 600; margin-bottom: 6px;
  }
  .modal-field input {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: var(--r-control);
    font-size: 13.5px; font-family: var(--font-body); background: var(--card-alt); color: var(--text-primary);
    outline: none;
  }
  .modal-field input:focus { border-color: var(--primary); }
  .modal-hint { font-size: 12px; color: var(--text-faint); margin: -6px 0 12px; }

  .group-current {
    font-size: 13px; color: var(--text-secondary); margin-bottom: 8px; line-height: 1.4;
    padding: 8px 10px; background: var(--card-alt); border: 1px solid var(--border); border-radius: var(--r-control);
  }
  .group-current strong { color: var(--text-primary); }
  .group-results { margin-top: 6px; max-height: 160px; overflow-y: auto; }
  .group-results:not(:empty) {
    border: 1px solid var(--border); border-radius: var(--r-control); background: var(--card-alt);
  }
  .group-result {
    padding: 8px 10px; cursor: pointer; font-size: 13px; color: var(--text-primary);
    border-bottom: 1px solid var(--border);
  }
  .group-result:last-child { border-bottom: none; }
  .group-result:hover { background: var(--card); }
  .group-result.gr-empty { cursor: default; color: var(--text-faint); }
  .group-result.gr-empty:hover { background: none; }
  .group-result .gr-meta { font-size: 11px; color: var(--text-faint); margin-top: 2px; }
  .group-ungroup-btn {
    margin-top: 10px; font-size: 12px; font-family: var(--font-mono); background: none; border: none;
    color: var(--text-secondary); cursor: pointer; padding: 0; text-decoration: underline;
  }
  .group-ungroup-btn:hover { color: var(--danger); }

  .modal-actions { display: flex; align-items: center; justify-content: flex-end; gap: 10px; margin-top: 16px; }
  .modal-status { margin-right: auto; font-size: 12px; color: var(--text-faint); }
  .modal-actions button {
    padding: 8px 16px; border-radius: var(--r-control); font-size: 13px; font-weight: 500; cursor: pointer;
    font-family: var(--font-body); border: 1px solid var(--border); background: var(--card-alt); color: var(--text-secondary);
  }
  #edit-cancel:hover { border-color: var(--primary); color: var(--primary); }
  #edit-save { background: #7B3FA0; border-color: #7B3FA0; color: #fff; }
  #edit-save:hover { opacity: .9; }
</style>
</head>
<body>

<header>
  <h1>Holy Grail Mk 6 Index</h1>
  <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Switch to dark mode" aria-pressed="false">
    <span class="toggle-track">
      <span class="toggle-sun"></span>
      <span class="toggle-knob"></span>
      <span class="toggle-moon"></span>
    </span>
  </button>
</header>

<div class="layout">
  <div class="filterbar">
    <div class="filter-group grow">
      <label>Search</label>
      <input id="f-search" type="text" placeholder="e.g. RVHS prelim 2023">
    </div>
    <div class="filter-group">
      <label>Subject</label>
      <select id="f-subject"><option value="">All subjects</option></select>
    </div>
    <div class="filter-group">
      <label>School</label>
      <div class="ms" id="f-school-ms">
        <button type="button" class="ms-trigger" id="f-school-trigger">All schools<span class="ms-caret">&#9662;</span></button>
        <div class="ms-panel" id="f-school-panel" hidden>
          <div class="ms-options" id="f-school-options"></div>
          <div class="ms-actions">
            <button type="button" data-clear="school">Clear</button>
          </div>
        </div>
      </div>
    </div>
    <div class="filter-group">
      <label>Year</label>
      <div class="ms" id="f-year-ms">
        <button type="button" class="ms-trigger" id="f-year-trigger">All years<span class="ms-caret">&#9662;</span></button>
        <div class="ms-panel year-panel" id="f-year-panel" hidden>
          <div class="year-range-inputs">
            <input type="text" id="f-year-from" placeholder="From" inputmode="numeric" maxlength="4">
            <span class="year-range-sep">&ndash;</span>
            <input type="text" id="f-year-to" placeholder="To" inputmode="numeric" maxlength="4">
          </div>
          <div class="ms-actions">
            <button type="button" id="f-year-clear">Clear</button>
            <button type="button" id="f-year-apply">Apply</button>
          </div>
        </div>
      </div>
    </div>
    <div class="filter-group">
      <label>Document type</label>
      <div class="ms" id="f-doctype-ms">
        <button type="button" class="ms-trigger" id="f-doctype-trigger">All types<span class="ms-caret">&#9662;</span></button>
        <div class="ms-panel" id="f-doctype-panel" hidden>
          <div class="ms-options" id="f-doctype-options"></div>
          <div class="ms-actions">
            <button type="button" data-clear="doctype">Clear</button>
          </div>
        </div>
      </div>
    </div>
    <div class="filter-group">
      <label>Paper</label>
      <div class="ms" id="f-paper-ms">
        <button type="button" class="ms-trigger" id="f-paper-trigger">All papers<span class="ms-caret">&#9662;</span></button>
        <div class="ms-panel" id="f-paper-panel" hidden>
          <div class="ms-options" id="f-paper-options"></div>
          <div class="ms-actions">
            <button type="button" data-clear="paper">Clear</button>
          </div>
        </div>
      </div>
    </div>
    <button class="reset-btn" id="f-reset">Reset filters</button>
  </div>

  <div class="results">
    <div class="col-headers">
      <div>Document</div>
      <div>Status</div>
      <div>School</div>
      <div>Subject</div>
      <div>Year</div>
      <div>Type</div>
      <div>Links</div>
    </div>
    <div class="results-scroll">
      <div id="rows"></div>
      <div class="empty" id="empty" style="display:none">No documents match these filters.</div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="edit-modal" hidden>
  <div class="modal">
    <h2 id="edit-modal-title">Edit document</h2>
    <p class="modal-subtitle" id="edit-modal-subtitle"></p>
    <div class="modal-field">
      <label>School</label>
      <input type="text" id="edit-school">
    </div>
    <div class="modal-field">
      <label>Paper info</label>
      <input type="text" id="edit-paper-info">
    </div>
    <div class="modal-field">
      <label>Subject</label>
      <input type="text" id="edit-subject">
    </div>
    <div class="modal-field">
      <label>Document type</label>
      <input type="text" id="edit-doctype">
    </div>
    <div class="modal-field">
      <label>Year</label>
      <input type="text" id="edit-year" inputmode="numeric" maxlength="4">
    </div>
    <div class="modal-field">
      <label>Paper number</label>
      <input type="text" id="edit-paper-number" inputmode="numeric" maxlength="1">
    </div>
    <div class="modal-field">
      <label>Group</label>
      <div class="group-current" id="group-current-label"></div>
      <input type="text" id="group-search" placeholder="Search school, subject, year, or filename to merge into...">
      <div class="group-results" id="group-results"></div>
      <button type="button" class="group-ungroup-btn" id="group-ungroup" hidden>Split into its own group</button>
    </div>
    <div class="modal-actions">
      <span class="modal-status" id="edit-status"></span>
      <button type="button" id="edit-cancel">Cancel</button>
      <button type="button" id="edit-save">Save</button>
    </div>
  </div>
</div>

<script>
let DATA = [];
let GROUPS = [];       // one entry per group_id: {isGroup, key, members:[...]}
const openGroups = new Set();

const $ = (id) => document.getElementById(id);
const esc = (s) => (s ?? "").toString().replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uniq = (arr) => [...new Set(arr.filter(Boolean))].sort();

const THEME_KEY = "grail-theme";
function applyTheme(theme) {
  document.documentElement.setAttribute("data-theme", theme);
  const btn = $("theme-toggle");
  btn.setAttribute("aria-pressed", theme === "dark" ? "true" : "false");
  btn.setAttribute("aria-label", theme === "dark" ? "Switch to light mode" : "Switch to dark mode");
}
function initTheme() {
  let stored = null;
  try { stored = localStorage.getItem(THEME_KEY); } catch { /* private mode etc */ }
  const theme = stored || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  applyTheme(theme);
}
$("theme-toggle").addEventListener("click", () => {
  const next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
  try { localStorage.setItem(THEME_KEY, next); } catch { /* private mode etc */ }
  applyTheme(next);
});
initTheme();

// Collapses the many raw paper_info_role variants (QP, Solution, TYS Answers, Essay Solutions Q3,
// Insert, Guide, ...) into exactly two badges: Answers or Questions. Anything that isn't clearly
// an answer/solution/mark scheme (including inserts, which accompany the question paper) counts
// as Questions.
function classifyRole(role) {
  const r = (role || "").trim().toLowerCase();
  if (r.includes("answer") || r.includes("solution") || r.includes("mark scheme")) return "Answers";
  return "Questions";
}

function isQuestionsRole(role) {
  return classifyRole(role) === "Questions";
}

function buildGroups(data) {
  const byId = new Map();
  for (const e of data) {
    if (!byId.has(e.group_id)) byId.set(e.group_id, []);
    byId.get(e.group_id).push(e);
  }
  const groups = [];
  for (const [gid, members] of byId) {
    if (members.length === 1) {
      groups.push({ isGroup: false, key: gid, primary: members[0], members });
    } else {
      const primary = members.find(m => isQuestionsRole(m.paper_info_role)) || members[0];
      members.sort((a, b) => (a.paper_number || 0) - (b.paper_number || 0)
        || (isQuestionsRole(a.paper_info_role) === isQuestionsRole(b.paper_info_role) ? 0 : isQuestionsRole(a.paper_info_role) ? -1 : 1));
      groups.push({ isGroup: true, key: gid, primary, members });
    }
  }
  return groups;
}

function populateSelect(id, values) {
  const el = $(id);
  const current = el.value;
  while (el.options.length > 1) el.remove(1);  // keep the "All ..." placeholder
  for (const v of values) {
    const opt = document.createElement("option");
    opt.value = v; opt.textContent = v;
    el.appendChild(opt);
  }
  if ([...el.options].some(o => o.value === current)) el.value = current;
}

// School/document-type/paper accept multiple selected values (checkbox dropdowns); year
// is a range with separate start/end inputs (either side may be left open-ended).
const multiFilters = { school: new Set(), doctype: new Set(), paper: new Set() };
let yearMin = null, yearMax = null;

const MULTI_LABELS = { school: "All schools", doctype: "All types", paper: "All papers" };

function updateMultiTrigger(key) {
  const trigger = $(`f-${key}-trigger`);
  const n = multiFilters[key].size;
  const label = n === 0 ? MULTI_LABELS[key] : (n === 1 ? [...multiFilters[key]][0] : `${n} selected`);
  trigger.firstChild.textContent = label;
  trigger.classList.toggle("active", n > 0);
}

function populateMultiSelect(key, values) {
  const optionsEl = $(`f-${key}-options`);
  optionsEl.innerHTML = "";
  for (const v of values) {
    const label = document.createElement("label");
    label.className = "ms-option";
    const input = document.createElement("input");
    input.type = "checkbox"; input.value = v;
    input.checked = multiFilters[key].has(v);
    input.addEventListener("change", () => {
      if (input.checked) multiFilters[key].add(v); else multiFilters[key].delete(v);
      updateMultiTrigger(key);
      applyFilters();
    });
    const span = document.createElement("span");
    span.textContent = v;
    label.appendChild(input);
    label.appendChild(span);
    optionsEl.appendChild(label);
  }
  updateMultiTrigger(key);
}

function closeAllPanels(except) {
  document.querySelectorAll(".ms-panel").forEach(p => {
    if (p !== except) p.hidden = true;
  });
}

function setupDropdown(key) {
  const trigger = $(`f-${key}-trigger`);
  const panel = $(`f-${key}-panel`);
  trigger.addEventListener("click", (ev) => {
    ev.stopPropagation();
    const willOpen = panel.hidden;
    closeAllPanels(willOpen ? panel : null);
    panel.hidden = !willOpen;
  });
  panel.addEventListener("click", (ev) => ev.stopPropagation());
}

document.addEventListener("click", () => closeAllPanels(null));

["school", "doctype", "paper"].forEach(setupDropdown);
document.querySelectorAll("[data-clear]").forEach(btn => {
  btn.addEventListener("click", () => {
    const key = btn.dataset.clear;
    multiFilters[key].clear();
    $(`f-${key}-options`).querySelectorAll("input").forEach(i => i.checked = false);
    updateMultiTrigger(key);
    applyFilters();
  });
});

function parseYearInput(value) {
  return /^\d{4}$/.test(value.trim()) ? Number(value.trim()) : null;
}

function updateYearTrigger() {
  const trigger = $("f-year-trigger");
  let label = "All years";
  if (yearMin != null && yearMax != null) label = yearMin === yearMax ? `${yearMin}` : `${yearMin}–${yearMax}`;
  else if (yearMin != null) label = `${yearMin}+`;
  else if (yearMax != null) label = `Up to ${yearMax}`;
  trigger.firstChild.textContent = label;
  trigger.classList.toggle("active", yearMin != null || yearMax != null);
}

function applyYearInput() {
  yearMin = parseYearInput($("f-year-from").value);
  yearMax = parseYearInput($("f-year-to").value);
  if (yearMin != null && yearMax != null && yearMin > yearMax) [yearMin, yearMax] = [yearMax, yearMin];
  updateYearTrigger();
  applyFilters();
}

setupDropdown("year");
$("f-year-apply").addEventListener("click", applyYearInput);
["f-year-from", "f-year-to"].forEach(id => {
  $(id).addEventListener("keydown", (ev) => {
    if (ev.key === "Enter") { applyYearInput(); $("f-year-panel").hidden = true; }
  });
});
$("f-year-clear").addEventListener("click", () => {
  $("f-year-from").value = "";
  $("f-year-to").value = "";
  yearMin = null; yearMax = null;
  updateYearTrigger();
  applyFilters();
});

// Reads every filter control once per applyFilters() call instead of once per document -
// with 3300+ documents, re-querying the DOM inside the per-entry predicate made every
// keystroke redo thousands of getElementById/.value calls.
function getFilterState() {
  const search = $("f-search").value.trim().toLowerCase();
  return {
    searchWords: search ? search.split(/\s+/).filter(Boolean) : [],
    subject: $("f-subject").value,
    schools: multiFilters.school,
    yearMin, yearMax,
    doctypes: multiFilters.doctype,
    papers: multiFilters.paper,
  };
}

function matchesFilters(e, f) {
  if (f.searchWords.length) {
    const hay = (e.display_name + " " + e.original_name).toLowerCase();
    if (!f.searchWords.every(w => hay.includes(w))) return false;
  }
  if (f.subject && e.subject !== f.subject) return false;
  if (f.schools.size && !f.schools.has(e.school)) return false;
  if (f.yearMin != null || f.yearMax != null) {
    const y = Number(e.year_resolved);
    if (!y) return false;
    if (f.yearMin != null && y < f.yearMin) return false;
    if (f.yearMax != null && y > f.yearMax) return false;
  }
  if (f.doctypes.size && !f.doctypes.has(e.doc_type)) return false;
  if (f.papers.size && !f.papers.has(String(e.paper_number))) return false;
  return true;
}

function applyFilters() {
  const f = getFilterState();
  const visible = [];
  for (const g of GROUPS) {
    if (g.isGroup) {
      const matched = g.members.filter(m => matchesFilters(m, f));
      if (matched.length) {
        const primary = matched.find(m => isQuestionsRole(m.paper_info_role)) || matched[0];
        visible.push({ ...g, primary, members: matched });
      }
    } else {
      if (matchesFilters(g.primary, f)) visible.push(g);
    }
  }
  visible.sort((a, b) => (Number(b.primary.year_resolved) || 0) - (Number(a.primary.year_resolved) || 0)
    || a.primary.display_name.localeCompare(b.primary.display_name));
  renderRows(visible);
}

function roleClass(role) {
  return classifyRole(role) === "Answers" ? "answers" : "questions";
}

function roleLabel(m) {
  return classifyRole(m.paper_info_role || m.doc_type);
}

// inline_url (document.grail.moe) is a stable direct link and opens in-tab; download_url
// (api.grail.moe) forces a download via an S3 Content-Disposition:attachment header
function pdfUrl(e) {
  return e.inline_url || e.download_url;
}

function flagBadgeHtml(e) {
  if (!e.flagged) return "";
  return `<span class="flag-badge" data-tooltip="${esc(e.flag_reason || "Flagged for review")}">! review</span>`;
}

function driveBadgeHtml(e) {
  if (e.source !== "drive") return "";
  return `<span class="drive-badge" title="From Google Drive"></span>`;
}

// Group headers are collapsed by default, so a flagged member inside would otherwise be invisible
function groupFlagBadgeHtml(members) {
  const flagged = members.filter(m => m.flagged);
  if (!flagged.length) return "";
  const tooltip = flagged.length === 1
    ? (flagged[0].flag_reason || "Flagged for review")
    : `${flagged.length} files flagged:\n` + flagged.map(m => `- ${m.flag_reason || "Flagged for review"}`).join("\n");
  return `<span class="flag-badge" data-tooltip="${esc(tooltip)}">! ${flagged.length} flagged</span>`;
}

// Group headers are collapsed by default, so show the badge if any member came from Drive
function groupDriveBadgeHtml(members) {
  return members.some(m => m.source === "drive")
    ? `<span class="drive-badge" title="Includes files from Google Drive"></span>`
    : "";
}

// A group's own title must never single out one paper number: for a known school, its
// group_id already merges every paper of the sitting (P1-P4, questions and answers alike)
// under one topic - the primary member just happens to carry its own paper number in
// display_name (e.g. "ACJC 2025 H2 Math Prelim P1"), which misrepresents the whole group.
const PAPER_NUM_RE = /(?<![A-Za-z0-9])P(?:aper)?\.?\s*[1-4](?![0-9])/gi;
function groupTitle(primary) {
  return (primary.display_name || "").replace(PAPER_NUM_RE, "").replace(/\s+/g, " ").trim();
}

function rowMetaHtml(e) {
  return `
    <div>${e.school ? `<span class="tag school">${esc(e.school)}</span>` : `<span class="cell-muted">-</span>`}</div>
    <div class="cell-muted">${esc(e.subject || "")}</div>
    <div class="cell-muted">${esc(e.year_resolved || "-")}</div>
    <div class="cell-muted">${esc(e.doc_type || "")}</div>`;
}

function renderRows(groups) {
  const container = $("rows");
  $("empty").style.display = groups.length ? "none" : "block";

  const frag = document.createDocumentFragment();
  for (const g of groups.slice(0, 600)) {
    if (g.isGroup) {
      const isOpen = openGroups.has(g.key);
      const row = document.createElement("div");
      row.className = "row group-row";
      row.innerHTML = `
        <div class="title-cell">
          <div class="member-title-wrap">
            <span class="group-title">${esc(groupTitle(g.primary))}</span>
            <span class="member-orig">${esc(g.primary.original_name)}</span>
          </div>
        </div>
        <div class="col-badges">
          <span class="role-badge exam-paper">Exam Paper</span>
          ${groupDriveBadgeHtml(g.members)}
          ${groupFlagBadgeHtml(g.members)}
        </div>
        ${rowMetaHtml(g.primary)}
        <div class="actions">
          <a href="${g.primary.note_url}" target="_blank" onclick="event.stopPropagation()">Source</a>
        </div>`;
      row.addEventListener("click", () => {
        if (openGroups.has(g.key)) openGroups.delete(g.key); else openGroups.add(g.key);
        applyFilters();
      });
      frag.appendChild(row);

      if (isOpen) {
        const membersWrap = document.createElement("div");
        membersWrap.className = "members";
        for (const m of g.members) {
          const mrow = document.createElement("div");
          mrow.className = "member-row";
          mrow.innerHTML = `
            <div class="title-cell">
              <span class="row-indent"></span>
              <div class="member-title-wrap">
                <a class="doc-link" href="${pdfUrl(m)}" target="_blank">${esc(m.display_name)}</a>
                <span class="member-orig">${esc(m.original_name)}</span>
              </div>
            </div>
            <div class="col-badges">
              <span class="role-badge ${roleClass(m.paper_info_role)}">${esc(roleLabel(m))}</span>
              ${driveBadgeHtml(m)}
              ${flagBadgeHtml(m)}
            </div>
            ${rowMetaHtml(m)}
            <div class="actions"><a href="${m.note_url}" target="_blank">Source</a><button type="button" class="edit-btn" data-id="${esc(m.id)}">Edit</button></div>`;
          membersWrap.appendChild(mrow);
        }
        frag.appendChild(membersWrap);
      }
    } else {
      const e = g.primary;
      const row = document.createElement("div");
      row.className = "row";
      row.innerHTML = `
        <div class="title-cell">
          <div class="member-title-wrap">
            <a class="doc-link" href="${pdfUrl(e)}" target="_blank">${esc(e.display_name)}</a>
            <span class="member-orig">${esc(e.original_name)}</span>
          </div>
        </div>
        <div class="col-badges">
          <span class="role-badge ${roleClass(e.paper_info_role)}">${esc(roleLabel(e))}</span>
          ${driveBadgeHtml(e)}
          ${flagBadgeHtml(e)}
        </div>
        ${rowMetaHtml(e)}
        <div class="actions"><a href="${e.note_url}" target="_blank">Source</a><button type="button" class="edit-btn" data-id="${esc(e.id)}">Edit</button></div>`;
      frag.appendChild(row);
    }
  }
  container.replaceChildren(frag);
}

let searchDebounce;
$("f-search").addEventListener("input", () => {
  clearTimeout(searchDebounce);
  searchDebounce = setTimeout(applyFilters, 100);
});
$("f-subject").addEventListener("input", applyFilters);
$("f-reset").addEventListener("click", () => {
  $("f-search").value = "";
  $("f-subject").value = "";
  for (const key of ["school", "doctype", "paper"]) {
    multiFilters[key].clear();
    $(`f-${key}-options`).querySelectorAll("input").forEach(i => i.checked = false);
    updateMultiTrigger(key);
  }
  $("f-year-from").value = "";
  $("f-year-to").value = "";
  yearMin = null; yearMax = null;
  updateYearTrigger();
  applyFilters();
});

// manual grouping UI disabled for now (server endpoints in server.py still work if re-enabled)

// Per-row metadata/grouping editor (local server only - every write backs up
// data/tagged.json to data/backups/ first, see server.py).
let editingId = null;
let groupIndex = [];  // built fresh each time the modal opens: [{group_id, label, count, searchText}]

function buildGroupIndex() {
  return GROUPS.map(g => ({
    group_id: g.key,
    label: g.primary.display_name,
    count: g.members.length,
    searchText: [
      g.primary.display_name, g.primary.school, g.primary.subject, g.primary.year_resolved,
      ...g.members.map(m => m.original_name),
    ].filter(Boolean).join(" ").toLowerCase(),
  }));
}

function renderGroupCurrent(e) {
  const grp = GROUPS.find(g => g.key === e.group_id);
  const count = grp ? grp.members.length : 1;
  $("group-current-label").innerHTML = count > 1
    ? `Grouped with <strong>${count - 1}</strong> other document${count - 1 === 1 ? "" : "s"} as <strong>${esc(e.display_name)}</strong>`
    : `Not currently grouped with any other document.`;
  $("group-ungroup").hidden = count <= 1;
}

function renderGroupResults(query, currentGroupId) {
  const resultsEl = $("group-results");
  resultsEl.innerHTML = "";
  const words = query.toLowerCase().trim().split(/\s+/).filter(Boolean);
  if (!words.length) return;

  const matches = groupIndex
    .filter(g => g.group_id !== currentGroupId && words.every(w => g.searchText.includes(w)))
    .slice(0, 8);

  if (!matches.length) {
    resultsEl.innerHTML = `<div class="group-result gr-empty">No matching groups</div>`;
    return;
  }
  for (const g of matches) {
    const div = document.createElement("div");
    div.className = "group-result";
    div.innerHTML = `${esc(g.label)}<div class="gr-meta">${g.count} file${g.count === 1 ? "" : "s"}</div>`;
    div.addEventListener("click", () => mergeIntoGroup(g.group_id, g.label));
    resultsEl.appendChild(div);
  }
}

async function mergeIntoGroup(targetGroupId, targetLabel) {
  $("edit-status").textContent = "Merging...";
  try {
    const res = await fetch(`/api/note/${encodeURIComponent(editingId)}/merge`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ target_group_id: targetGroupId }),
    });
    const body = await res.json();
    if (!res.ok) throw new Error(body.error || "Merge failed");
    DATA = body.entries;
    GROUPS = buildGroups(DATA);
    groupIndex = buildGroupIndex();
    applyFilters();
    const entry = DATA.find(d => d.id === editingId);
    renderGroupCurrent(entry);
    $("group-search").value = "";
    $("group-results").innerHTML = "";
    $("edit-status").textContent = `Merged into "${targetLabel}"`;
  } catch (err) {
    $("edit-status").textContent = err.message;
  }
}

async function ungroupEntry() {
  $("edit-status").textContent = "Splitting...";
  try {
    const res = await fetch(`/api/note/${encodeURIComponent(editingId)}/ungroup`, { method: "POST" });
    const body = await res.json();
    if (!res.ok) throw new Error(body.error || "Split failed");
    DATA = body.entries;
    GROUPS = buildGroups(DATA);
    groupIndex = buildGroupIndex();
    applyFilters();
    const entry = DATA.find(d => d.id === editingId);
    renderGroupCurrent(entry);
    $("edit-status").textContent = "Split into its own group";
  } catch (err) {
    $("edit-status").textContent = err.message;
  }
}

let groupSearchDebounce;
$("group-search").addEventListener("input", () => {
  clearTimeout(groupSearchDebounce);
  groupSearchDebounce = setTimeout(() => {
    const entry = DATA.find(d => d.id === editingId);
    renderGroupResults($("group-search").value, entry ? entry.group_id : null);
  }, 120);
});
$("group-ungroup").addEventListener("click", ungroupEntry);

function openEditModal(e) {
  editingId = e.id;
  $("edit-modal-title").textContent = e.display_name;
  $("edit-modal-subtitle").textContent = e.original_name;
  $("edit-school").value = e.school || "";
  $("edit-paper-info").value = e.paper_info || "";
  $("edit-subject").value = e.subject || "";
  $("edit-doctype").value = e.doc_type || "";
  $("edit-year").value = e.year_resolved || "";
  $("edit-paper-number").value = e.paper_number ?? "";
  $("edit-status").textContent = "";
  groupIndex = buildGroupIndex();
  renderGroupCurrent(e);
  $("group-search").value = "";
  $("group-results").innerHTML = "";
  $("edit-modal").hidden = false;
}

function closeEditModal() {
  $("edit-modal").hidden = true;
  editingId = null;
}

$("edit-cancel").addEventListener("click", closeEditModal);
$("edit-modal").addEventListener("click", (ev) => {
  if (ev.target.id === "edit-modal") closeEditModal();
});

$("rows").addEventListener("click", (ev) => {
  const btn = ev.target.closest(".edit-btn");
  if (!btn) return;
  ev.stopPropagation();
  const entry = DATA.find(d => d.id === btn.dataset.id);
  if (entry) openEditModal(entry);
});

$("edit-save").addEventListener("click", async () => {
  if (!editingId) return;
  const payload = {
    school: $("edit-school").value.trim() || null,
    paper_info: $("edit-paper-info").value.trim() || null,
    subject: $("edit-subject").value.trim() || null,
    doc_type: $("edit-doctype").value.trim() || null,
    year_resolved: $("edit-year").value.trim() || null,
    paper_number: $("edit-paper-number").value.trim() || null,
  };
  $("edit-status").textContent = "Saving...";
  try {
    const res = await fetch(`/api/note/${encodeURIComponent(editingId)}`, {
      method: "PATCH",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });
    const body = await res.json();
    if (!res.ok) throw new Error(body.error || "Save failed");
    const idx = DATA.findIndex(d => d.id === body.id);
    if (idx !== -1) DATA[idx] = body;
    GROUPS = buildGroups(DATA);
    applyFilters();
    closeEditModal();
  } catch (err) {
    $("edit-status").textContent = err.message;
  }
});

async function loadData() {
  const data = await fetch("/api/notes").then(r => r.json());
  DATA = data;
  GROUPS = buildGroups(data);
  populateSelect("f-subject", uniq(data.map(d => d.subject)));
  populateMultiSelect("school", uniq(data.map(d => d.school)));
  populateMultiSelect("doctype", uniq(data.map(d => d.doc_type)));
  populateMultiSelect("paper", uniq(data.map(d => d.paper_number)).sort((a,b) => a - b).map(n => String(n)));
  applyFilters();
}

loadData();
</script>

</body>
</html>
