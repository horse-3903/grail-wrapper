<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Grail Local Index</title>
<style>
  :root {
    --bg: #0f1420; --panel: #161d2e; --border: #2a3348; --text: #e8ecf4;
    --muted: #8b93a7; --accent: #f5a623; --accent-dim: #3a2f1a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, sans-serif; background: var(--bg); color: var(--text); }
  header { padding: 16px 24px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 16px; }
  header h1 { font-size: 18px; margin: 0; }
  header .count { color: var(--muted); font-size: 13px; }
  .layout { display: flex; height: calc(100vh - 57px); }
  .filters { width: 250px; padding: 16px; border-right: 1px solid var(--border); overflow-y: auto; flex-shrink: 0; }
  .filters label { display: block; font-size: 12px; color: var(--muted); margin: 12px 0 4px; text-transform: uppercase; letter-spacing: .04em; }
  .filters select, .filters input { width: 100%; padding: 6px 8px; background: var(--panel); border: 1px solid var(--border); color: var(--text); border-radius: 6px; font-size: 13px; }
  .results { flex: 1; overflow-y: auto; padding: 12px 24px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; padding: 8px 10px; color: var(--muted); font-weight: 600; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--bg); cursor: pointer; user-select: none; }
  td { padding: 7px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
  tr:hover td { background: var(--panel); }
  .tag { display: inline-block; padding: 1px 6px; border-radius: 4px; font-size: 11px; background: var(--accent-dim); color: var(--accent); margin-right: 4px; }
  .actions a, .actions button { font-size: 12px; padding: 4px 9px; border-radius: 5px; border: 1px solid var(--border); background: var(--panel); color: var(--text); cursor: pointer; text-decoration: none; margin-right: 4px; }
  .actions a:hover, .actions button:hover { border-color: var(--accent); color: var(--accent); }
  .flagged { color: #e06c75; font-size: 11px; }
  .empty { color: var(--muted); padding: 40px; text-align: center; }
</style>
</head>
<body>

<header>
  <h1>Grail Local Index</h1>
  <span class="count" id="count"></span>
</header>

<div class="layout">
  <div class="filters">
    <label>Search name</label>
    <input id="f-search" type="text" placeholder="e.g. RVHS prelim">

    <label>Subject</label>
    <select id="f-subject"><option value="">All</option></select>

    <label>School</label>
    <select id="f-school"><option value="">All</option></select>

    <label>Year</label>
    <select id="f-year"><option value="">All</option></select>

    <label>Document Type</label>
    <select id="f-doctype"><option value="">All</option></select>

    <label>Paper Info</label>
    <select id="f-paperinfo"><option value="">All</option></select>

    <label><input type="checkbox" id="f-flagged" style="width:auto;display:inline-block;margin-right:6px;">Only flagged (needs review)</label>
  </div>

  <div class="results">
    <table>
      <thead>
        <tr>
          <th data-key="name">Document Name</th>
          <th data-key="school">School</th>
          <th data-key="subject">Subject</th>
          <th data-key="year">Year</th>
          <th data-key="doc_type">Type</th>
          <th data-key="paper_info">Paper Info</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="empty" id="empty" style="display:none">No documents match these filters.</div>
  </div>
</div>

<script>
let DATA = [];
let sortKey = null, sortDir = 1;

const $ = (id) => document.getElementById(id);

function uniq(arr) { return [...new Set(arr.filter(Boolean))].sort(); }

function populateSelect(id, values) {
  const el = $(id);
  for (const v of values) {
    const opt = document.createElement("option");
    opt.value = v; opt.textContent = v;
    el.appendChild(opt);
  }
}

function applyFilters() {
  const search = $("f-search").value.toLowerCase();
  const subject = $("f-subject").value;
  const school = $("f-school").value;
  const year = $("f-year").value;
  const doctype = $("f-doctype").value;
  const paperinfo = $("f-paperinfo").value;
  const flaggedOnly = $("f-flagged").checked;

  let rows = DATA.filter(d => {
    if (search && !d.name.toLowerCase().includes(search)) return false;
    if (subject && d.subject !== subject) return false;
    if (school && d.school !== school) return false;
    if (year && String(d.year) !== year) return false;
    if (doctype && d.doc_type !== doctype) return false;
    if (paperinfo && d.paper_info !== paperinfo) return false;
    if (flaggedOnly && !d.flagged) return false;
    return true;
  });

  if (sortKey) {
    rows.sort((a, b) => {
      const av = (a[sortKey] || "").toString();
      const bv = (b[sortKey] || "").toString();
      return av.localeCompare(bv, undefined, {numeric: true}) * sortDir;
    });
  }

  renderRows(rows);
  $("count").textContent = `${rows.length} / ${DATA.length} documents`;
}

function renderRows(rows) {
  const tbody = $("rows");
  tbody.innerHTML = "";
  $("empty").style.display = rows.length ? "none" : "block";

  const frag = document.createDocumentFragment();
  for (const d of rows.slice(0, 500)) {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${d.name}${d.flagged ? `<div class="flagged">- ${d.flag_reason || "check details"}</div>` : ""}</td>
      <td>${d.school ? `<span class="tag">${d.school}</span>` : ""}</td>
      <td>${d.subject || ""}</td>
      <td>${d.year || ""}</td>
      <td>${d.doc_type || ""}</td>
      <td>${d.paper_info || ""}</td>
      <td class="actions">
        <a href="/api/download/${d.id}" target="_blank">Open</a>
        <a href="${d.note_url}" target="_blank">Source</a>
      </td>`;
    frag.appendChild(tr);
  }
  tbody.appendChild(frag);
}

document.querySelectorAll("th[data-key]").forEach(th => {
  th.addEventListener("click", () => {
    const key = th.dataset.key;
    sortDir = (sortKey === key) ? -sortDir : 1;
    sortKey = key;
    applyFilters();
  });
});

["f-search", "f-subject", "f-school", "f-year", "f-doctype", "f-paperinfo", "f-flagged"].forEach(id => {
  $(id).addEventListener("input", applyFilters);
});

fetch("/api/notes").then(r => r.json()).then(data => {
  DATA = data;
  populateSelect("f-subject", uniq(data.map(d => d.subject)));
  populateSelect("f-school", uniq(data.map(d => d.school)));
  populateSelect("f-year", uniq(data.map(d => d.year)));
  populateSelect("f-doctype", uniq(data.map(d => d.doc_type)));
  populateSelect("f-paperinfo", uniq(data.map(d => d.paper_info)));
  applyFilters();
});
</script>

</body>
</html>
